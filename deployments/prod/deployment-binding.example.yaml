schema_version: 3
deployment_id: production-contract
# PRODUCTION TEMPLATE. Every server_schema_bundle_hash, server_build, and
# data_release_hash is a MUST-REPLACE placeholder (REPLACE_WITH_*) that passes
# Production admission structurally but is not a real fingerprint. Obtain the
# real three values with `uv run krw-capabilityd --print-identity` and
# substitute them before `krw-agentd --check`. Production admission rejects
# zero hashes (sha256:0000...0000) and server_build == "fixture".
capabilities:
  - binding_key: krw_ontology_query_context
    mcp_tool_name: krw_ontology_query_context
    transport: mcp-http
    endpoint_ref: krw-ontology-local
    credential_ref: null
    auth_scope: tenant
    tool_session_reuse: attested-stateless-v1
    server_schema_bundle_hash: sha256:REPLACE_WITH_TOOL_SCHEMA_SHA256
    server_build: REPLACE_WITH_BUILD_ID
    data_release_hash: sha256:REPLACE_WITH_RELEASE_MANIFEST_SHA256
    max_connections: 4
    request_timeout_ms: 30000
