schema_version: 4
registry_id: glm-only-production-2026-08
# Production template. GLM's documented 200K context window and 128K maximum
# output are recorded as binary token capacities (204800 and 131072).
models:
  - model_id: glm-5.3
    api_base: https://api.z.ai/api/anthropic
    api_version: anthropic-messages-v1
    max_context_tokens: 204800
    max_output_tokens: 131072
    max_in_flight: 32
    provider_wire_capabilities:
      thinking:
        supported: true
        supports_tools: true
        supports_tool_choice: true
        supports_json_object: true
        supports_json_schema_output: false
        supports_strict_tool_input: false
      non_thinking:
        supported: true
        supports_tools: true
        supports_tool_choice: true
        supports_json_object: true
        supports_json_schema_output: false
        supports_strict_tool_input: false
      # GLM can omit thinking on tool-only turns; the kernel normalizes replay
      # messages without fabricating stored model reasoning.
      requires_thinking_block_replay: false
      requires_assistant_content_for_tool_calls: false
profiles:
  - profile_id: glm_high
    model_id: glm-5.3
    thinking: enabled
    reasoning_effort: high
  - profile_id: glm_max
    model_id: glm-5.3
    thinking: enabled
    reasoning_effort: max
  - profile_id: glm_direct
    model_id: glm-5.3
    thinking: disabled
    reasoning_effort: null
