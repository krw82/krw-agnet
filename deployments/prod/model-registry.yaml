schema_version: 3
registry_id: deepseek-production-2026-08
# PRODUCTION TEMPLATE. Model definitions mirror deployments/local/model-registry.yaml.
# max_in_flight: 64 is the per-model concurrency ceiling and is enforced by the
# runtime semaphore (see crates/runtime-config admission).
models:
  - model_id: deepseek-v4-flash
    api_base: https://api.deepseek.com/anthropic
    api_version: anthropic-messages-v1
    max_context_tokens: 1000000
    max_output_tokens: 384000
    max_in_flight: 64
    provider_wire_capabilities:
      thinking:
        supported: true
        supports_tools: true
        supports_tool_choice: false
        supports_json_object: true
      non_thinking:
        supported: true
        supports_tools: true
        # Verified against the native DeepSeek V4 Flash endpoint: a semantic
        # capability decision may use tools, but this deployment must omit
        # `tool_choice` in both thinking modes. The kernel enforces the
        # semantic requirement through typed recovery, not this wire field.
        supports_tool_choice: false
        supports_json_object: true
      requires_thinking_block_replay: true
      requires_assistant_content_for_tool_calls: true
profiles:
  - profile_id: flash_high
    model_id: deepseek-v4-flash
    thinking: enabled
    reasoning_effort: high
  - profile_id: flash_max
    model_id: deepseek-v4-flash
    thinking: enabled
    reasoning_effort: max
  - profile_id: flash_direct
    model_id: deepseek-v4-flash
    thinking: disabled
    reasoning_effort: null
