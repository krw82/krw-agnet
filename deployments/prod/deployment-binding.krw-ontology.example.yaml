schema_version: 4
deployment_id: production-krw-ontology-contract
# PRODUCTION TEMPLATE. Every server_schema_bundle_hash, server_build, and
# data_release_hash is a MUST-REPLACE placeholder (REPLACE_WITH_*) that passes
# Production admission structurally but is not a real fingerprint. Obtain the
# real three values with `uv run krw-capabilityd --print-identity` and
# substitute them before `krw-agentd --check`. Production admission rejects
# zero hashes (sha256:0000...0000) and server_build == "fixture".
capabilities:
