schema_version: 1
registry_id: krw-ontology-production-v1
# PRODUCTION TEMPLATE. Budget envelopes mirror deployments/local/budget-registry.yaml
# and use the expanded (relaxed) turn/call/deadline values from the current
# agents/krw-ontology/agent.yaml work. registry_id is production-appropriate.
profiles:
  # Balanced envelope: enough turns/calls for quality answers, capped to
  # keep latency practical (~90s average). Output tokens are bounded per role.
  - profile_id: company_research_full
    limits:
      max_provider_turns: 12
      max_capability_calls: 5
      max_replans: 3
      max_repairs: 3
      max_input_tokens: 176000
      max_output_tokens: 28000
      max_evidence_bytes: 8388608
      deadline_ms: 300000
      capability_call_limits:
        ontology.query_context: 2
        ontology.company_context: 1
        market.snapshot: 1
        ontology.query: 2
        ontology.trace: 1
        ontology.chain: 1
  - profile_id: company_research_glm
    limits:
      max_provider_turns: 12
      max_capability_calls: 5
      max_replans: 3
      max_repairs: 3
      # Reserve 200,000 combined tokens per GLM turn, leaving 4,800 tokens
      # below its 204,800-token context capacity for provider framing.
      max_input_tokens: 176000
      max_output_tokens: 28000
      max_evidence_bytes: 8388608
      deadline_ms: 600000
      capability_call_limits:
        ontology.query_context: 2
        ontology.company_context: 1
        market.snapshot: 1
        ontology.query: 2
        ontology.trace: 1
        ontology.chain: 1
  - profile_id: earnings_deep_dive
    limits:
      max_provider_turns: 10
      max_capability_calls: 5
      max_replans: 1
      max_repairs: 1
      max_input_tokens: 120000
      # Two GLM Guru turns seal the lens/brief before the ordinary filing
      # researcher continues in the parent workflow. Keep a separate tail for
      # evidence review and the final Korean answer.
      max_output_tokens: 24000
      max_evidence_bytes: 8388608
      deadline_ms: 300000
      capability_call_limits:
        ontology.query_context: 2
        ontology.query: 2
        ontology.trace: 1
        ontology.chain: 1
  - profile_id: scenario_sensitivity
