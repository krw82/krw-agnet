schema_version: 1
registry_id: krw-ontology-production-v1
# PRODUCTION TEMPLATE. Budget envelopes mirror deployments/local/budget-registry.yaml
# and use the expanded (relaxed) turn/call/deadline values from the current
# agents/krw-ontology/agent.yaml work. registry_id is production-appropriate.
profiles:
  # Balanced envelope: enough turns/calls for quality answers, capped to
  # keep latency practical (~90s average). Output tokens are bounded per role.
  - profile_id: company_research_full
    limits:
      max_provider_turns: 12
      max_capability_calls: 5
      max_replans: 3
      max_repairs: 3
      max_input_tokens: 176000
      max_output_tokens: 56000
      max_evidence_bytes: 8388608
      deadline_ms: 300000
      capability_call_limits:
        ontology.query_context: 2
        ontology.company_context: 1
        market.snapshot: 1
        ontology.query: 2
        ontology.trace: 1
        ontology.chain: 1
  - profile_id: company_research_glm
    limits:
      max_provider_turns: 20
      max_capability_calls: 16
      max_replans: 3
      max_repairs: 3
      # This is a cumulative run budget, not a single provider request. A
      # detailed multi-objective company question can legitimately reuse its
      # grounded context across several turns before composition. At 80% the
      # kernel stops optional research and moves to the answer phase, so this
      # GLM-5.3 has a 204800-token context. Keep the existing 144000-token
      # input allowance (long follow-ups need it) and expand the cumulative
      # output tail to 60000: 144000 + 60000 = 204000.
      max_input_tokens: 144000
      max_output_tokens: 60000
      max_evidence_bytes: 8388608
      # This shared profile is also selected by the production DeepSeek model
      # registry. Rich-answer revision 2026-08-16/17: 16 calls / 20 turns
      # restore the legacy evidence depth, and high-reasoning turns run
      # 96-144s each, so the wall-clock ceiling moves to 40 minutes - the
      # old 5-call/20-minute envelope visibly thinned answers and starved
      # deep runs at the clock.
      deadline_ms: 2400000
      capability_call_limits:
        ontology.query_context: 4
        ontology.company_context: 2
        market.snapshot: 2
        ontology.query: 4
        ontology.trace: 2
        ontology.chain: 2
  - profile_id: earnings_deep_dive
    limits:
      max_provider_turns: 16
      max_capability_calls: 12
      max_replans: 1
      max_repairs: 1
      max_input_tokens: 120000
      # Two GLM Guru turns seal the lens/brief before the ordinary filing
      # researcher continues in the parent workflow. Keep a separate tail for
      # evidence review and the final Korean answer. The compose retry
      # reserve (2 x the 16384-token composer cap) plus the minimum research
      # turn is 34816, so the output tail must stay above that threshold or
      # the run is rejected at start (final output reservation exceeds
      # output budget).
      max_output_tokens: 36864
      max_evidence_bytes: 8388608
      deadline_ms: 1200000
      capability_call_limits:
        ontology.query_context: 4
        ontology.query: 4
        ontology.trace: 2
        ontology.chain: 2
  - profile_id: scenario_sensitivity
    limits:
      max_provider_turns: 20
      max_capability_calls: 12
      max_replans: 1
      # Two repair chances: the plan lane (proposal contract violations)
      # shares this counter with the compose lane, and production failures
      # showed a single QualitativePredicateMissing rejection killing the
      # run at 0.4min with the compose lane never reached.
      max_repairs: 2
      max_input_tokens: 120000
      # 45056 keeps the mandatory compose-reserve threshold (34816) covered
      # with real cumulative headroom: one extra 8192-token repair turn must
      # not convert a fast rejection into OutputBudgetExceeded.
      max_output_tokens: 45056
      max_evidence_bytes: 8388608
      deadline_ms: 1200000
      capability_call_limits:
        ontology.query_context: 4
        ontology.query: 4
        ontology.trace: 2
        ontology.chain: 2
  - profile_id: idea_generation
    limits:
      max_provider_turns: 16
      max_capability_calls: 10
      max_replans: 1
      max_repairs: 1
      max_input_tokens: 120000
      # Must exceed the compose retry reserve threshold (34816): see
      # earnings_deep_dive above.
      max_output_tokens: 36864
      max_evidence_bytes: 8388608
      deadline_ms: 900000
      capability_call_limits:
        ontology.query_context_universe: 4
        ontology.query_universe: 4
        ontology.trace_universe: 2
  - profile_id: wide_research
    limits:
      max_provider_turns: 20
      max_capability_calls: 12
      max_replans: 1
      max_repairs: 1
      max_input_tokens: 120000
      # Must exceed the compose retry reserve threshold (34816): see
      # earnings_deep_dive above.
      max_output_tokens: 36864
      max_evidence_bytes: 8388608
      deadline_ms: 1200000
      capability_call_limits:
        ontology.query_context_universe: 4
        ontology.query_universe: 5
        ontology.trace_universe: 3
  - profile_id: open_research
    limits:
      # The free door spans the wide discovery loop plus the market-plane
      # observation frontier, so it carries more turns/calls than wide.
      max_provider_turns: 24
      max_capability_calls: 24
      max_replans: 1
      max_repairs: 1
      max_input_tokens: 120000
      # Must exceed the compose retry reserve threshold (34816): see
      # earnings_deep_dive above.
      max_output_tokens: 36864
      max_evidence_bytes: 8388608
      deadline_ms: 1500000
      capability_call_limits:
        ontology.query_context_universe: 4
        ontology.query_universe: 4
        ontology.trace_universe: 2
        openbb.quote: 3
        openbb.metrics: 3
        openbb.income_statement: 3
        openbb.filings: 3
        news.web_search: 2
  - profile_id: display_plan_minimal
    limits:
      max_provider_turns: 4
      max_capability_calls: 1
      max_replans: 1
      max_repairs: 1
      max_input_tokens: 24000
      max_output_tokens: 6000
      max_evidence_bytes: 1048576
      deadline_ms: 60000
      capability_call_limits: {}
  - profile_id: feed_discovery
    limits:
      max_provider_turns: 12
      max_capability_calls: 4
      max_replans: 1
      max_repairs: 1
      max_input_tokens: 64000
      max_output_tokens: 8000
      max_evidence_bytes: 4194304
      deadline_ms: 180000
      capability_call_limits:
        feed.list_items: 2
        feed.get_items: 2
  - profile_id: news_research
    limits:
      max_provider_turns: 18
      max_capability_calls: 8
      max_replans: 1
      max_repairs: 2
      max_input_tokens: 120000
      # The news analyst now runs at the 16384-token ceiling (thinking plus
      # the capability decision share it), so the cumulative tail must hold
      # two analyst turns plus the compose tail.
      max_output_tokens: 36864
      max_evidence_bytes: 8388608
      # A passing news run needs ~4 minutes of GLM turns plus the compose
      # tail; the old 120000ms wall killed every run at exactly 2.0min,
      # below even the recorded 4.1min success (production 2026-08-19).
      deadline_ms: 900000
      capability_call_limits:
        feed.get_items: 2
        feed.get_context: 2
        ontology.query_context: 2
        ontology.query: 1
        ontology.trace: 1
  - profile_id: market_move_research
    limits:
      max_provider_turns: 18
      max_capability_calls: 8
      max_replans: 1
      max_repairs: 2
      max_input_tokens: 120000
      max_output_tokens: 36864
      max_evidence_bytes: 8388608
      deadline_ms: 900000
      capability_call_limits:
        feed.get_items: 2
        feed.get_context: 2
        ontology.query_context: 2
        ontology.query: 1
        ontology.trace: 1
  - profile_id: news_filing_correlation
    limits:
      max_provider_turns: 18
      max_capability_calls: 8
      max_replans: 1
      max_repairs: 2
      max_input_tokens: 120000
      max_output_tokens: 36864
      max_evidence_bytes: 8388608
      deadline_ms: 900000
      capability_call_limits:
        feed.get_items: 2
        feed.get_context: 2
        filing.search_catalog: 1
        ontology.query_context: 1
        ontology.query: 1
        ontology.trace: 1
  - profile_id: guru_company_advisor
    limits:
      max_provider_turns: 20
      max_capability_calls: 11
      max_replans: 1
      max_repairs: 2
      max_input_tokens: 120000
      # The parent envelope covers the ordinary filing researcher (GLM
      # thinking + the capability decision share one 16384-token output
      # ceiling, mirroring the company analyst), the evidence review, and the
      # final Korean composition: mirror company_research_glm's 60000 tail so
      # three deep research turns plus the composer never trip the cumulative
      # output budget mid-run.
      max_output_tokens: 60000
      max_evidence_bytes: 8388608
      # Guru uses several normal GLM turns; match company_research_glm's
      # 40-minute wall-clock envelope so a slow but valid turn is not
      # mistaken for a workflow failure. With the researcher at the full
      # 16384-token ceiling, real lens consultations run 10-15 minutes and
      # the old ten-minute wall killed them at the deadline (production
      # 2026-08-19: buffett/terry_smith refires finished at exactly 10.0min).
      deadline_ms: 2400000
      capability_call_limits:
        guru.query_context: 1
        guru.company_brief: 2
        ontology.query_context: 2
        ontology.query: 2
        ontology.trace: 1
        ontology.chain: 1
        guru.review_company_evidence: 2
  - profile_id: notebook_transform
    limits:
      max_provider_turns: 8
      max_capability_calls: 1
      max_replans: 1
      max_repairs: 1
      max_input_tokens: 64000
      max_output_tokens: 12000
      max_evidence_bytes: 4194304
      deadline_ms: 180000
      capability_call_limits: {}
  - profile_id: router_minimal
    limits:
      max_provider_turns: 4
      max_capability_calls: 1
      max_replans: 1
      max_repairs: 1
      max_input_tokens: 16000
      max_output_tokens: 2000
      max_evidence_bytes: 1048576
      deadline_ms: 30000
      capability_call_limits: {}
  - profile_id: source_filing_followup
    limits:
      max_provider_turns: 20
      max_capability_calls: 10
      max_replans: 1
      max_repairs: 2
      max_input_tokens: 120000
      max_output_tokens: 14000
      max_evidence_bytes: 8388608
      deadline_ms: 120000
      capability_call_limits:
        filing.get: 2
        filing.get_brief: 2
        filing.list_sections: 1
        filing.read_section: 2
        filing.list_documents: 1
        filing.read_document: 1
        filing.get_form4: 1
