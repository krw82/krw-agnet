      max_replans: 1
      max_repairs: 2
      max_input_tokens: 120000
      # The parent envelope covers the ordinary filing researcher plus the
      # final evidence review/composer turns.
      max_output_tokens: 28000
      max_evidence_bytes: 8388608
      # Guru uses several normal GLM turns; keep the same ten-minute
      # envelope as company_research_glm so a slow but valid turn is not
      # mistaken for a workflow failure. Existing action caps remain explicit;
      # the causal chain gets one additional optional slot.
      deadline_ms: 600000
      capability_call_limits:
        guru.query_context: 1
        guru.company_brief: 2
        ontology.query_context: 2
        ontology.query: 2
        ontology.trace: 1
        ontology.chain: 1
        guru.review_company_evidence: 2
