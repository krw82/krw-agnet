schema_version: 1
registry_id: krw-ontology-local-v1
profiles:
  # Balanced envelope: enough turns/calls for quality answers, capped to
  # keep latency practical (~90s average). Output tokens are bounded per role.
  - profile_id: company_research_full
    limits:
      max_provider_turns: 32
      max_capability_calls: 16
      max_replans: 3
      max_repairs: 3
      max_input_tokens: 168000
      max_output_tokens: 56000
      max_evidence_bytes: 8388608
      deadline_ms: 300000
      capability_call_limits:
        ontology.query_context: 6
        ontology.company_context: 1
        market.snapshot: 1
        ontology.query: 6
        ontology.trace: 4
        ontology.chain: 4
  # GLM-5.3 is the active research profile. Keep local and production on the
  # same bounded envelope. Rich-answer revision 2026-08-16: evidence
  # collection was capped at 5 capability calls, which starved the composer
  # and visibly thinned answers against the July legacy baseline (~2,350
  # chars / 60 lines then vs ~1,160 / 22 at 5 calls). Restore the legacy
  # research loop depth; high-reasoning provider turns run 96-144 seconds
  # each, so the wall-clock deadline stays twenty minutes.
  - profile_id: company_research_glm
    limits:
      max_provider_turns: 20
      max_capability_calls: 16
      max_replans: 3
      max_repairs: 3
      # This is a cumulative run budget, not a single provider request. A
      # detailed multi-objective company question can legitimately reuse its
      # grounded context across several turns before composition. At 80% the
      # kernel stops optional research and moves to the answer phase, so this
      # GLM-5.3 has a 204800-token context. The filing-event/news fallback
      # ladder (2026-08-28) adds catalog and feed evidence to the transcript,
      # and a 9-turn ladder run reached 158875 input tokens against the old
      # 144000 allowance, escaping to the ledger fallback before composing.
      # Rebalance the same 204000 cumulative envelope toward input:
      # 168000 + 36000 = 204000.
      max_input_tokens: 168000
      max_output_tokens: 36000
      max_evidence_bytes: 8388608
      # Wall-clock ceiling for the 20-turn envelope: GLM high-reasoning turns
      # run 96-144s each, so a full-depth run needs ~32-48 minutes. The old
      # 20-minute deadline starved exactly those deep runs (2026-08-16 A/B:
      # five of eight fell to the ledger fallback at the clock while three
      # shallower runs composed real answers in 11-14 minutes).
      deadline_ms: 2400000
      capability_call_limits:
        ontology.query_context: 4
        ontology.company_context: 2
        market.snapshot: 2
        ontology.query: 4
        ontology.trace: 2
        ontology.chain: 2
  - profile_id: earnings_deep_dive
    limits:
      max_provider_turns: 16
      max_capability_calls: 12
      max_replans: 1
      max_repairs: 1
      max_input_tokens: 120000
      # Two GLM Guru turns seal the lens/brief before the ordinary filing
      # researcher continues in the parent workflow. Keep a separate tail for
      # evidence review and the final Korean answer. Must exceed the compose
      # retry reserve threshold (2 x 16384 + 2048 = 34816) or the run is
      # rejected at start.
      max_output_tokens: 36864
      max_evidence_bytes: 8388608
      deadline_ms: 1200000
      capability_call_limits:
        ontology.query_context: 4
        ontology.query: 4
        ontology.trace: 2
        ontology.chain: 2
  - profile_id: scenario_sensitivity
    limits:
      # The scenario workflow has two planning stages, evidence assessment,
      # optional trace/chain work, scenario construction, and final writing.
      # Ten turns can exhaust before the composer receives a turn; keep room
      # for the full declared path plus one bounded repair.
      max_provider_turns: 20
      max_capability_calls: 12
      max_replans: 1
      # Two repair chances: the plan lane shares this counter with the
      # compose lane, and production showed a single proposal rejection
      # killing the run with the compose lane never reached.
      max_repairs: 2
      max_input_tokens: 120000
      # 45056 keeps the compose-reserve threshold (34816) covered with real
      # cumulative headroom for one extra repair turn.
      max_output_tokens: 45056
      max_evidence_bytes: 8388608
      deadline_ms: 1200000
      capability_call_limits:
        ontology.query_context: 4
        ontology.query: 4
        ontology.trace: 2
        ontology.chain: 2
  - profile_id: idea_generation
    limits:
      max_provider_turns: 16
      max_capability_calls: 10
      max_replans: 1
      max_repairs: 1
      max_input_tokens: 120000
      # Must exceed the compose retry reserve threshold (34816).
      max_output_tokens: 36864
      max_evidence_bytes: 8388608
      deadline_ms: 900000
      capability_call_limits:
        ontology.query_context_universe: 4
        ontology.query_universe: 4
        ontology.trace_universe: 2
  - profile_id: wide_research
    limits:
      max_provider_turns: 20
      max_capability_calls: 12
      max_replans: 1
      max_repairs: 1
      max_input_tokens: 120000
      # Must exceed the compose retry reserve threshold (34816).
      max_output_tokens: 36864
      max_evidence_bytes: 8388608
      deadline_ms: 1200000
      capability_call_limits:
        ontology.query_context_universe: 4
        ontology.query_universe: 5
        ontology.trace_universe: 3
  - profile_id: display_plan_minimal
    limits:
      max_provider_turns: 4
      max_capability_calls: 1
      max_replans: 1
      max_repairs: 1
      max_input_tokens: 24000
      max_output_tokens: 6000
      max_evidence_bytes: 1048576
      deadline_ms: 60000
      capability_call_limits: {}
  - profile_id: feed_discovery
    limits:
      max_provider_turns: 12
      max_capability_calls: 4
      max_replans: 1
      max_repairs: 1
      max_input_tokens: 64000
      max_output_tokens: 8000
      max_evidence_bytes: 4194304
      deadline_ms: 180000
      capability_call_limits:
        feed.list_items: 2
        feed.get_items: 2
  - profile_id: news_research
    limits:
      max_provider_turns: 18
      max_capability_calls: 8
      max_replans: 1
      max_repairs: 2
      max_input_tokens: 120000
      # The news analyst now runs at the 16384-token ceiling; the tail must
      # hold two analyst turns plus the compose tail.
      max_output_tokens: 36864
      max_evidence_bytes: 8388608
      # A passing news run needs ~4 minutes; the old 120000ms wall killed
      # every run at exactly 2.0min (production 2026-08-19).
      deadline_ms: 900000
      capability_call_limits:
        feed.get_items: 2
        feed.get_context: 2
        ontology.query_context: 2
        ontology.query: 1
        ontology.trace: 1
  - profile_id: market_move_research
    limits:
      max_provider_turns: 18
      max_capability_calls: 8
      max_replans: 1
      max_repairs: 2
      max_input_tokens: 120000
      max_output_tokens: 36864
      max_evidence_bytes: 8388608
      deadline_ms: 900000
      capability_call_limits:
        feed.get_items: 2
        feed.get_context: 2
        ontology.query_context: 2
        ontology.query: 1
        ontology.trace: 1
  - profile_id: news_filing_correlation
    limits:
      max_provider_turns: 18
      max_capability_calls: 8
      max_replans: 1
      max_repairs: 2
      max_input_tokens: 120000
      max_output_tokens: 36864
      max_evidence_bytes: 8388608
      deadline_ms: 900000
      capability_call_limits:
        feed.get_items: 2
        feed.get_context: 2
        filing.search_catalog: 1
        ontology.query_context: 1
        ontology.query: 1
        ontology.trace: 1
  - profile_id: guru_company_advisor
    limits:
      max_provider_turns: 20
      max_capability_calls: 11
      max_replans: 1
      max_repairs: 2
      max_input_tokens: 120000
      # The parent envelope covers the ordinary filing researcher (GLM
      # thinking + the capability decision share one 16384-token output
      # ceiling), the evidence review, and the final composition: mirror
      # company_research_glm's 60000 tail so deep research turns never trip
      # the cumulative output budget mid-run.
      max_output_tokens: 60000
      max_evidence_bytes: 8388608
      # Guru uses several normal GLM turns; match company_research_glm's
      # 40-minute wall-clock envelope so a slow but valid turn is not
      # mistaken for a workflow failure. With the researcher at the full
      # 16384-token ceiling, real lens consultations run 10-15 minutes and
      # the old ten-minute wall killed them at the deadline (production
      # 2026-08-19: buffett/terry_smith refires finished at exactly 10.0min).
      deadline_ms: 2400000
      capability_call_limits:
        guru.query_context: 1
        guru.company_brief: 2
        ontology.query_context: 2
        ontology.query: 2
        ontology.trace: 1
        ontology.chain: 1
        guru.review_company_evidence: 2
  - profile_id: notebook_transform
    limits:
      max_provider_turns: 8
      max_capability_calls: 1
      max_replans: 1
      max_repairs: 1
      max_input_tokens: 64000
      max_output_tokens: 12000
      max_evidence_bytes: 4194304
      deadline_ms: 180000
      capability_call_limits: {}
  - profile_id: router_minimal
    limits:
      max_provider_turns: 4
      max_capability_calls: 1
      max_replans: 1
      max_repairs: 1
      max_input_tokens: 16000
