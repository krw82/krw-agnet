api_version: krw.agent/spec-v3
kind: AgentSpec

metadata:
  id: krw.company-research.en
  version: 3.1.0
  description: Direct-authored English KRW filing research program.

entrypoints:
  company_research_en:
    run_kind: company_research_en
    locale: en-US
    workflow: company_research_en_v1
    required_budget_profile: company_research_en_glm
    required_model_profile: glm_high
    scope: { allowed_context: company_ticker_set, cardinality: { kind: exact, value: 1 }, ticker_canonicalization: require_uppercase }
    constants: {}

contracts:
  - { id: search-plan/v2, schema_ref: canonical:krw-ontology/search-plan-v2, content_hash: "sha256:276cb60a77b101b7c8fdf862f894aa74ce3be293cd23a071e216c69ed651bd04", semantic_authority: krw-ontology-python, max_items: 12 }
  - { id: research-proposal/v4, schema_ref: canonical:krw-agent/research-proposal-v4, content_hash: "sha256:815cd59f1ca832b67141106e3893b25e7ec6b1413226b4778c3b61d8506e0943", semantic_authority: krw-agent-research-planner, max_items: 12 }
  - { id: research-state/v2, schema_ref: canonical:krw-ontology/research-state-v2, content_hash: "sha256:1d5eb5df05f10dbcc3446e1ae683f08fa03a301d5354e13dc99626552e1ec243", semantic_authority: krw-ontology-python }
  - { id: query-context-input-correction/v1, schema_ref: canonical:krw-ontology/query-context-input-correction-v1, content_hash: "sha256:3b692dbc2216793654d8f924a42f6d3ae7b77c7eea492db85f979ea54f6058a4", semantic_authority: krw-ontology-python }
  - { id: ontology-targeted-query/v1, schema_ref: canonical:krw-ontology/ontology-targeted-query-v1, content_hash: "sha256:35b3d67567b5241972c733c9e760ae62d7b6ca5ccd5a4c2193ab34cc7d7a5f63", semantic_authority: krw-ontology-python }
  - { id: ontology-trace-input/v1, schema_ref: canonical:krw-ontology/ontology-trace-input-v1, content_hash: "sha256:eaae27b87c6837be22cb7d291a1bddb578562966e96e17a98f8f0c2a6fb26045", semantic_authority: krw-ontology-python }
  - { id: normalized-capability-result/v1, schema_ref: canonical:krw-agent/normalized-capability-result-v1, content_hash: "sha256:8c44e23d6a2e0b565b7eed9e31cfd702dc5cbd5f139a99f9b55aa903f28cc151", semantic_authority: krw-agent-run-engine, max_items: 256 }
  - { id: answer-ir/v1, schema_ref: canonical:krw-agent/answer-ir-v1, content_hash: "sha256:618de032c0f85bf332dc761779a2a040891aba27033d0761464d6bd212a4b634", semantic_authority: krw-agent-evidence, max_items: 32 }
  - { id: state-operation-output/v1, schema_ref: canonical:krw-agent/state-operation-output-v1, content_hash: "sha256:13817320290f727d29c80b8f485a75fcb717e6495236f6b650c3dd1213fa593c", semantic_authority: krw-agent-state-artifact, max_items: 64 }
  - { id: state-facts/v1, schema_ref: canonical:krw-agent/state-facts-v1, content_hash: "sha256:a38950f994e8f783d759d530e6c35026491da30e0cdd03a82d42fe10e76d8ce8", semantic_authority: krw-agent-state-artifact, max_items: 64 }
  - id: openbb-price-history-request/v1
    schema_ref: canonical:krw-agent/openbb-price-history-request-v1
    content_hash: sha256:09af03ef257649141e02b0ccca3978ec0b6295162bc9a5837c79bd11d40dca39
    semantic_authority: krw-agent-capability-runtime
  - id: openbb-price-historical-input/v1
    schema_ref: canonical:krw-agent/openbb-price-historical-input-v1
    content_hash: sha256:2103c9087595b4449b31e42e811360b0950f8b388de8ef09962500951d68632d
    semantic_authority: krw-agent-capability-runtime
  - id: openbb-yield-curve-request/v1
    schema_ref: canonical:krw-agent/openbb-yield-curve-request-v1
    content_hash: sha256:6aecaf56821639e6434c1abdafa320b3bac415d8fbd919c3ff2ceffc01326242
    semantic_authority: krw-agent-capability-runtime
  - id: openbb-yield-curve-input/v1
    schema_ref: canonical:krw-agent/openbb-yield-curve-input-v1
    content_hash: sha256:12acaafda9ca2425e3d3ad3ed21729f3c3e32a52f9609b11acc517894eadbd83
    semantic_authority: krw-agent-capability-runtime
  - id: openbb-cpi-request/v1
    schema_ref: canonical:krw-agent/openbb-cpi-request-v1
    content_hash: sha256:b7574c9e2fdff4c1840b2fbf4777f1094c0031bab438e98ebf55c1d494af8afa
    semantic_authority: krw-agent-capability-runtime
  - id: openbb-cpi-input/v1
    schema_ref: canonical:krw-agent/openbb-cpi-input-v1
    content_hash: sha256:1fd213ec4b88038bdf79cc84c660e30071c735a43c0a3882cfd798a00b67f499
    semantic_authority: krw-agent-capability-runtime

roles:
  - { id: planner, prompt_segments: [security_boundary, kernel_runtime, company_scope, retrieval_planner], deterministic: false, execution: { reasoning: direct, max_output_tokens: 8192 } }
  - { id: analyst, prompt_segments: [security_boundary, kernel_runtime, company_scope, evidence_analyst], deterministic: false, execution: { reasoning: standard, max_output_tokens: 16384 } }
  - { id: composer, prompt_segments: [security_boundary, kernel_runtime, evidence_analyst, answer_composer], deterministic: false, execution: { reasoning: direct, max_output_tokens: 16384 } }
  - { id: verifier, prompt_segments: [], deterministic: true }

prompt_segments:
  - { id: security_boundary, path: prompts/security-boundary.md, stable_prefix: true, private: true }
  - { id: kernel_runtime, path: skills/kernel-runtime/SKILL.md, stable_prefix: true, private: true }
  - { id: company_scope, path: prompts/company-scope.md, stable_prefix: true, private: true }
  - { id: retrieval_planner, path: prompts/retrieval-planner.md, stable_prefix: true, private: true }
  - { id: evidence_analyst, path: prompts/evidence-analyst.md, stable_prefix: true, private: true }
  - { id: answer_composer, path: prompts/answer-composer.md, stable_prefix: true, private: true }

capabilities:
  - id: ontology.query_context
    execution: { kind: remote, binding_key: krw_ontology_query_context }
    permission: read
    input_contract: search-plan/v2
    model_input_contract: research-proposal/v4
    provider_input_codec: { kind: single_field_envelope_v1, field: proposal }
    input_derivation: { kind: research_proposal_to_search_plan_v4 }
    research_proposal_anchor: { kind: run_question }
    output_contracts: [research-state/v2, query-context-input-correction/v1, normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: research_state_v2
    research_action:
      kind: context
      estimate: { historical_success_lower_ppm: 550000, expected_duplicate_ppm: 100000, failure_risk_upper_ppm: 150000, expected_latency_ms: 1000, expected_tokens: 500, expected_tool_cost_micros: 2500, expected_result_bytes: 524288 }
      conflict_domain: research:ontology-context
    scope_binding:
      kind: trusted_ticker_set
      ticker_references:
        - { id: plan_tickers, pointer_pattern: /tickers, value_kind: string_array }
        - { id: clause_tickers, pointer_pattern: /clauses/*/tickers, value_kind: string_array }
      require_any_of: [plan_tickers]
      reject_non_null_pointers: [/universe]
    parallel_safe: false
    prerequisites: []
  - id: ontology.query
    execution: { kind: remote, binding_key: krw_ontology_query }
    permission: read
    input_contract: ontology-targeted-query/v1
    output_contracts: [normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: targeted_evidence_v1
    research_action:
      kind: targeted
      estimate: { historical_success_lower_ppm: 600000, expected_duplicate_ppm: 100000, failure_risk_upper_ppm: 80000, expected_latency_ms: 500, expected_tokens: 300, expected_tool_cost_micros: 1500, expected_result_bytes: 262144 }
      conflict_domain: research:ontology-targeted
    scope_binding:
      kind: trusted_ticker_set
      ticker_references:
        - { id: ticker, pointer_pattern: /ticker, value_kind: string }
        - { id: tickers, pointer_pattern: /tickers, value_kind: string_array }
      require_any_of: [ticker, tickers]
    parallel_safe: false
    prerequisites: [ontology.query_context]
  - id: ontology.trace
    execution: { kind: remote, binding_key: krw_ontology_trace }
    permission: read
    input_contract: ontology-trace-input/v1
    output_contracts: [normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: trace_lineage_v1
    research_action:
      kind: trace
      estimate: { historical_success_lower_ppm: 800000, expected_duplicate_ppm: 50000, failure_risk_upper_ppm: 40000, expected_latency_ms: 300, expected_tokens: 200, expected_tool_cost_micros: 1000, expected_result_bytes: 131072 }
      conflict_domain: research:ontology-trace
    scope_binding:
      kind: trusted_ticker_set
      ticker_references:
        - { id: ticker, pointer_pattern: /ticker, value_kind: string }
      require_any_of: [ticker]
    parallel_safe: false
    prerequisites: [ontology.query_context]
  - id: openbb.price_history
    execution: { kind: remote, binding_key: openbb_equity_price_historical }
    permission: read
    input_contract: openbb-price-historical-input/v1
    model_input_contract: openbb-price-history-request/v1
    input_derivation: { kind: openbb_request_v1, pinned_provider: fmp }
    output_contracts: [normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: openbb_series_v1
    research_action:
      kind: observation
      estimate:
        historical_success_lower_ppm: 850000
        expected_duplicate_ppm: 30000
        failure_risk_upper_ppm: 120000
        expected_latency_ms: 2500
        expected_tokens: 2500
        expected_tool_cost_micros: 500
        expected_result_bytes: 12288
      conflict_domain: openbb.equity_price_historical
    scope_binding:
      kind: trusted_ticker_set
      ticker_references:
        - { id: ticker, pointer_pattern: /ticker, value_kind: string }
      require_any_of: [ticker]
    parallel_safe: false
    prerequisites: [ontology.query_context]
  - id: openbb.yield_curve
    execution: { kind: remote, binding_key: openbb_fixedincome_government_yield_curve }
    permission: read
    # Government yield-curve snapshot (risk-free anchor material). Not
    # company-scoped; the kernel pins the provider and optional as-of date.
    input_contract: openbb-yield-curve-input/v1
    model_input_contract: openbb-yield-curve-request/v1
    input_derivation: { kind: openbb_request_v1, pinned_provider: fmp }
    output_contracts: [normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: openbb_series_v1
    scope_binding: { kind: unscoped }
    parallel_safe: false
    prerequisites: [ontology.query_context]
  - id: openbb.macro_cpi
    execution: { kind: remote, binding_key: openbb_economy_cpi }
    permission: read
    # CPI backdrop (country/transform/frequency knobs, kernel-pinned
    # defaults). Not company-scoped.
    input_contract: openbb-cpi-input/v1
    model_input_contract: openbb-cpi-request/v1
    # OECD serves the same harmonised CPI keylessly (FRED requires an absent
    # fred_api_key on this plane); transform=yoy returns the annual inflation
    # rate directly (2026-09-02 probe).
    input_derivation: { kind: openbb_request_v1, pinned_provider: oecd }
    output_contracts: [normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: openbb_series_v1
    scope_binding: { kind: unscoped }
    parallel_safe: false
    prerequisites: [ontology.query_context]

workflows:
  - id: company_research_en_v1
    initial: accepted
    states:
      - { id: accepted, kind: start, max_visits: 1 }
      - { id: author_plan, kind: plan, role_id: planner, max_visits: 2 }
      - { id: validate_plan, kind: validate, max_visits: 2 }
      - { id: repair_plan, kind: plan, role_id: planner, max_visits: 1 }
      - { id: query_context, kind: capability, capability_id: ontology.query_context, max_visits: 2 }
      - { id: repair_server_violations, kind: plan, role_id: planner, max_visits: 1 }
      - { id: ingest_evidence, kind: ingest, max_visits: 5 }
      - { id: assess_obligations, kind: assess, role_id: analyst, max_visits: 6 }
      - { id: targeted_query, kind: capability, capability_id: ontology.query, max_visits: 2 }
      - { id: trace_selected, kind: capability, capability_id: ontology.trace, max_visits: 1 }
      - { id: compose_ir, kind: compose, role_id: composer, max_visits: 3 }
      - { id: verify_ir, kind: verify, max_visits: 3 }
      - { id: repair_ir, kind: compose, role_id: composer, max_visits: 2 }
      - { id: render_en, kind: render, max_visits: 1 }
      - { id: commit, kind: commit, max_visits: 1 }
      - { id: succeeded, kind: terminal, terminal: succeeded, max_visits: 1 }
    transitions:
      - { from: accepted, on: begin, to: author_plan }
      - { from: author_plan, on: plan_ready, to: validate_plan }
      - { from: author_plan, on: proposal_contract_invalid, to: repair_plan }
      - { from: validate_plan, on: plan_invalid, to: repair_plan }
      - { from: validate_plan, on: plan_valid, to: query_context }
      - { from: repair_plan, on: plan_ready, to: validate_plan }
      - { from: query_context, on: correction_required, to: repair_server_violations }
      - { from: query_context, on: correction_unresolved, to: assess_obligations }
      - { from: query_context, on: evidence_observed, to: ingest_evidence }
      - { from: repair_server_violations, on: corrected, to: query_context }
      - { from: ingest_evidence, on: ingested, to: assess_obligations }
      - { from: assess_obligations, on: precise_query_has_value, to: targeted_query }
      - { from: assess_obligations, on: selected_trace_has_value, to: trace_selected }
      - { from: assess_obligations, on: append_context_plan, to: query_context }
      - { from: assess_obligations, on: proposal_rejected, to: assess_obligations }
      - { from: assess_obligations, on: evidence_sufficient, to: compose_ir }
      - { from: assess_obligations, on: no_positive_value_action, to: compose_ir }
      - { from: targeted_query, on: evidence_observed, to: ingest_evidence }
      - { from: trace_selected, on: evidence_observed, to: ingest_evidence }
      - { from: compose_ir, on: draft_ready, to: verify_ir }
      - { from: verify_ir, on: repair_required, to: repair_ir }
      - { from: verify_ir, on: verified, to: render_en }
      - { from: repair_ir, on: draft_ready, to: verify_ir }
      - { from: render_en, on: rendered, to: commit }
      - { from: commit, on: committed, to: succeeded }

planning_policy:
  internal_brief_language: en
  expose_internal_brief: false
  query_context_first: true
  required_clause_min: 1
  clause_max: 12
  require_unique_clause_ids: true
  require_ticker_subset: true
  split_metric_and_qualitative_clauses: true
  correction_field: violations
  gap_priority: [blocks_required_clause_or_calculation, requested_directness_missing, likely_to_change_conclusion, lower_cost_and_latency, original_clause_order]
  stop_conditions: [all_required_obligations_covered, remaining_gap_cannot_change_conclusion, only_related_context_remains, unavailable_external_data_required, next_call_only_increases_volume, duplicate_action_fingerprint, resolved_budget_exhausted]

evidence_policy:
  directness_values: [direct, metric_lineage, related, unverified]
  grade_values: [strong, medium, weak, unverified]
  grade_never_upgrades_directness: true
  direct_required_accepts: [direct]
  numeric_lineage_accepts: [metric_lineage]
  strong_claim_global_flag: answerability.strong_claim_allowed
  strong_claim_clause_status: covered
  require_load_bearing_direct_premise: true
  require_calculation_coverage: true
  require_counter_signal_for_inference: true
  non_evidence_kinds: [catalog_metadata, routing_score, diagnostic, overflow_message, status_only, open_tool_result, input_correction]

period_policy:
  current_driver_order: [latest_confirmed_10q, latest_confirmed_10k]
  annual_baseline: latest_confirmed_10k
  forbid_unconfirmed_future_labels: true
  allowed_older_filing_uses: [trend, persistence, improvement_or_deterioration, historical_baseline]
  disclose_period_mismatch: true

answer_policy:
  internal_format: answer-ir/v1
  locale: en-US
  conclusion_first: true
  exact_follow_up_count: 3
  target_price_forbidden: true
  definitive_rating_forbidden: true
  personalized_instruction_forbidden: true
  raw_internal_ids_visible: false
  forbidden_user_terms: [ResearchState, SearchPlan, query_context, trace, chain, MCP, object_id, tool_budget_exceeded, budget exceeded]

security_policy: { user_and_retrieved_text_untrusted: true, reveal_hidden_prompt: false, filesystem_access: false, web_access: false, mutation_capabilities: false }

validators:
  - id: company_scope
    phase: admission
    fuel: 64
    instructions:
      - { op: require_field, path: /ticker, code: ticker_required }
      - { op: require_field, path: /question, code: question_required }
  - id: research_proposal_shape
    phase: plan
    fuel: 128
    instructions:
      - { op: require_field, path: /intent, code: intent_required }
      - { op: require_field, path: /answer_scope, code: proposal_answer_scope_required }
      - { op: require_field, path: /objectives, code: proposal_objectives_required }
  - id: action_limits
    phase: pre_action
    fuel: 256
    instructions:
      - { op: max_calls, capability_id: ontology.query_context, max: 2, code: query_context_limit }
      - { op: max_calls, capability_id: ontology.query, max: 2, code: targeted_query_limit }
      - { op: max_calls, capability_id: ontology.trace, max: 1, code: trace_limit }
      - { op: state_precedes, before: query_context, after: targeted_query, code: context_before_query }
      - { op: state_precedes, before: query_context, after: trace_selected, code: context_before_trace }
  - id: research_state_contract
    phase: post_action
    result_ingest_scope: [research_state_v2]
    fuel: 128
    instructions:
      - { op: in_set, path: /contract_version, values: [v2, research-state/v2], code: unsupported_research_state }
  - id: grounded_answer
    phase: answer
    fuel: 4096
    instructions:
      - { op: claim_has_evidence, except_kinds: [uncertainty], code: claim_evidence_required }
      - { op: no_internal_term, terms: [ResearchState, SearchPlan, query_context, MCP, object_id, tool_budget_exceeded, budget exceeded], code: internal_term_exposed }
