    required_model_profile: glm_max
    scope: { allowed_context: company_ticker_set, cardinality: { kind: exact, value: 1 }, ticker_canonicalization: require_uppercase }
    constants: { fixed_guru_author: flatt }
    pinned_skills: [guru_flatt_style]
  guru_marks:
    run_kind: guru_marks
    locale: ko-KR
    workflow: guru_company_advisor_v1
    required_budget_profile: guru_company_advisor
    required_model_profile: glm_max
