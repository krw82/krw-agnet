roles:
  - { id: guru_retrieval, prompt_segments: [security_boundary, kernel_runtime, guru_retrieval], deterministic: false, execution: { reasoning: direct, max_output_tokens: 4096 } }
  - { id: investigation_author, prompt_segments: [security_boundary, kernel_runtime, guru_retrieval, investigation_brief], deterministic: false, execution: { reasoning: standard, max_output_tokens: 8192 } }
  - id: company_evidence_researcher
    prompt_segments: [security_boundary, kernel_runtime, skill_catalog, company_evidence_research, investigation_brief, guru_analysis]
    deterministic: false
    # This is an ordinary research role inside the Guru workflow. It uses the
    # parent run's normal budget and state context; it is not a bounded child.
    # Evidence selection, countercase comparison, and chain interpretation are
    # analyst work, so keep GLM thinking enabled with the same bounded ceiling
    # and the same High effort tier as the ordinary company analyst
    # (Standard). Max-effort thinking on a rich evidence set consumed the
    # whole 16384-token output ceiling before the analysis JSON started
    # (finish_reason=length, dependency escape; production OXY 2026-08-19)
    # while the Standard analyst handles the same evidence volume fine.
    execution: { reasoning: standard, max_output_tokens: 16384 }
  - id: guru_composer
    prompt_segments: [security_boundary, kernel_runtime, guru_analysis, guru_answer, author_style]
    deterministic: false
    # Final prose has no tools to select. Keep it direct like the ordinary
    # company composer so GLM does not spend the answer turn on hidden
    # thinking after the evidence review is already sealed.
    execution: { reasoning: direct, max_output_tokens: 8192 }
  - { id: verifier, prompt_segments: [], deterministic: true }

prompt_segments:
  - { id: security_boundary, path: prompts/security-boundary.md, stable_prefix: true, private: true }
  - { id: kernel_runtime, path: skills/kernel-runtime/SKILL.md, stable_prefix: true, private: true }
  - { id: guru_retrieval, path: prompts/guru-retrieval.md, stable_prefix: true, private: true }
  - { id: investigation_brief, path: prompts/investigation-brief.md, stable_prefix: false, private: true }
  - { id: guru_analysis, path: prompts/guru-analysis.md, stable_prefix: false, private: true }
  - { id: guru_answer, path: prompts/guru-answer.md, stable_prefix: false, private: true }
  - { id: author_style, path: prompts/author-style.md, stable_prefix: false, private: true }
  - { id: guru_ackman_style, path: skills/guru-ackman-style/SKILL.md, stable_prefix: false, private: true }
  - { id: guru_buffett_style, path: skills/guru-buffett-style/SKILL.md, stable_prefix: false, private: true }
  - { id: guru_flatt_style, path: skills/guru-flatt-style/SKILL.md, stable_prefix: false, private: true }
  - { id: guru_marks_style, path: skills/guru-marks-style/SKILL.md, stable_prefix: false, private: true }
  - { id: guru_terry_smith_style, path: skills/guru-terry-smith-style/SKILL.md, stable_prefix: false, private: true }
  - { id: company_evidence_research, path: skills/company-evidence-research/SKILL.md, stable_prefix: true, private: true, loadable: true }
  - { id: guru_chain_interpretation, path: skills/guru-chain-interpretation/SKILL.md, stable_prefix: false, private: true, loadable: true }
  - { id: guru_countercase_research, path: skills/guru-countercase-research/SKILL.md, stable_prefix: false, private: true, loadable: true }
  - { id: guru_scenario_evidence, path: skills/guru-scenario-evidence/SKILL.md, stable_prefix: false, private: true, loadable: true }
  - id: skill_catalog
    skill_catalog: { skills_dirs: [skills] }
    stable_prefix: true
    private: true

capabilities:
  - id: guru.query_context
    execution: { kind: remote, binding_key: krw_guru_query_context }
    permission: read
    input_contract: krw-guru-query-context-input/v1
    model_input_contract: guru-query-request/v1
    input_derivation: { kind: sealed_guru_query_context_v1 }
    output_contracts: [krw-guru-query-context-result/v1, normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: guru_query_context_v1
    retain_canonical_input: true
    scope_binding:
      kind: trusted_ticker_set
      ticker_references:
        - { id: ticker, pointer_pattern: /ticker, value_kind: string }
      require_any_of: [ticker]
    parallel_safe: false
    prerequisites: []
  - id: guru.company_brief
    execution: { kind: remote, binding_key: krw_guru_company_brief }
    permission: read
    input_contract: krw-guru-company-brief-input/v1
    model_input_contract: krw-guru-investigation-question-draft/v1
    input_derivation:
      kind: sealed_guru_company_brief_v1
      query_context_capability: guru.query_context
    output_contracts: [krw-guru-company-brief-result/v1, krw-guru-input-correction/v1, normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: guru_company_brief_v1
    scope_binding:
      kind: trusted_ticker_set
      ticker_references:
        - { id: ticker, pointer_pattern: /ticker, value_kind: string }
      require_any_of: [ticker]
    parallel_safe: false
    prerequisites: [guru.query_context]
  - id: ontology.query_context
    execution: { kind: remote, binding_key: krw_ontology_query_context }
    permission: read
    input_contract: search-plan/v2
    model_input_contract: research-proposal/v4
    provider_input_codec: { kind: single_field_envelope_v1, field: proposal }
    input_derivation: { kind: research_proposal_to_search_plan_v4 }
    # The ordinary researcher reads the sealed GuruResearchFrame (one central
    # tension plus its independent evidence needs) and emits the ordinary
    # multi-objective ResearchProposal v4. The kernel then lowers that
    # proposal; the model never receives or owns a physical SearchPlan.
    research_proposal_anchor: { kind: sealed_guru_investigation_brief_v1, source_capability: guru.company_brief }
    output_contracts: [research-state/v2, query-context-input-correction/v1, normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: research_state_v2
    research_action:
      kind: context
      estimate: { historical_success_lower_ppm: 550000, expected_duplicate_ppm: 100000, failure_risk_upper_ppm: 150000, expected_latency_ms: 1000, expected_tokens: 500, expected_tool_cost_micros: 2500, expected_result_bytes: 524288 }
      conflict_domain: research:ontology-context
    scope_binding:
      kind: trusted_ticker_set
      ticker_references:
        - { id: plan_tickers, pointer_pattern: /tickers, value_kind: string_array }
        - { id: clause_tickers, pointer_pattern: /clauses/*/tickers, value_kind: string_array }
      require_any_of: [plan_tickers]
      reject_non_null_pointers: [/universe]
    parallel_safe: false
    prerequisites: [guru.company_brief]
  - id: ontology.query
    execution: { kind: remote, binding_key: krw_ontology_query }
    permission: read
    input_contract: ontology-targeted-query/v1
    output_contracts: [normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: targeted_evidence_v1
    research_action:
      kind: targeted
      estimate: { historical_success_lower_ppm: 600000, expected_duplicate_ppm: 100000, failure_risk_upper_ppm: 80000, expected_latency_ms: 500, expected_tokens: 300, expected_tool_cost_micros: 1500, expected_result_bytes: 262144 }
      conflict_domain: research:ontology-targeted
    scope_binding:
      kind: trusted_ticker_set
      ticker_references:
        - { id: ticker, pointer_pattern: /ticker, value_kind: string }
        - { id: tickers, pointer_pattern: /tickers, value_kind: string_array }
      require_any_of: [ticker, tickers]
    parallel_safe: false
    prerequisites: [ontology.query_context]
  - id: guru.review_company_evidence
    execution: { kind: remote, binding_key: krw_guru_review_company_evidence }
    permission: read
    input_contract: krw-guru-evidence-review-input/v1
    model_input_contract: krw-guru-agent-evidence-analysis/v1
    input_derivation:
      kind: sealed_guru_evidence_review_v1
      query_context_capability: guru.query_context
      company_brief_capability: guru.company_brief
      evidence_capabilities: [ontology.query_context, ontology.query, ontology.trace, ontology.chain]
    output_contracts: [krw-guru-evidence-review-result/v1, krw-guru-input-correction/v1, normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: guru_evidence_review_v1
    scope_binding:
      kind: trusted_ticker_set
      ticker_references:
        - { id: ticker, pointer_pattern: /ticker, value_kind: string }
      require_any_of: [ticker]
    parallel_safe: false
    prerequisites: [guru.query_context, guru.company_brief, ontology.query_context]
  - id: ontology.trace
    execution: { kind: remote, binding_key: krw_ontology_trace }
    permission: read
    input_contract: ontology-trace-input/v1
    output_contracts: [normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: trace_lineage_v1
    research_action:
      kind: trace
      estimate: { historical_success_lower_ppm: 800000, expected_duplicate_ppm: 50000, failure_risk_upper_ppm: 40000, expected_latency_ms: 300, expected_tokens: 200, expected_tool_cost_micros: 1000, expected_result_bytes: 131072 }
      conflict_domain: research:ontology-trace
    scope_binding:
      kind: trusted_ticker_set
      ticker_references:
        - { id: ticker, pointer_pattern: /ticker, value_kind: string }
      require_any_of: [ticker]
    parallel_safe: false
    prerequisites: [ontology.query_context]
  - id: ontology.chain
    execution: { kind: remote, binding_key: krw_ontology_chain }
    permission: read
    # Chain is an object-centered follow-up, so it uses the already pinned
    # trace envelope rather than the search envelope. The runtime keeps the
    # returned relationship graph in provider context and records the root as
    # supplemental evidence.
    input_contract: ontology-trace-input/v1
    output_contracts: [normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: trace_lineage_v1
    research_action:
      kind: trace
      estimate: { historical_success_lower_ppm: 700000, expected_duplicate_ppm: 50000, failure_risk_upper_ppm: 50000, expected_latency_ms: 500, expected_tokens: 300, expected_tool_cost_micros: 1500, expected_result_bytes: 262144 }
      conflict_domain: research:ontology-chain
    scope_binding:
      kind: trusted_ticker_set
      ticker_references:
        - { id: ticker, pointer_pattern: /ticker, value_kind: string }
      require_any_of: [ticker]
    parallel_safe: false
    prerequisites: [ontology.query_context]
  - id: skill.load
    execution: { kind: local, builtin: skill_load }
    permission: read
    input_contract: skill-load/v1
    output_contracts: [skill-content/v1, normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: skill_content_v1
    scope_binding: { kind: unscoped }
    parallel_safe: true
    prerequisites: []

workflows:
  - id: guru_company_advisor_v1
    initial: accepted
    states:
      - { id: accepted, kind: start, max_visits: 1 }
      - { id: author_guru_query, kind: plan, role_id: guru_retrieval, max_visits: 1 }
      - { id: validate_guru_query, kind: validate, max_visits: 1 }
      - { id: retrieve_guru_research_pack, kind: capability, capability_id: guru.query_context, max_visits: 1 }
      - { id: ingest_guru_research_pack, kind: ingest, max_visits: 1 }
      - { id: draft_one_key_question, kind: plan, role_id: investigation_author, max_visits: 2 }
      - { id: validate_key_question, kind: validate, max_visits: 2 }
      - { id: repair_key_question, kind: plan, role_id: investigation_author, max_visits: 1 }
      - { id: seal_investigation_brief, kind: capability, capability_id: guru.company_brief, max_visits: 2 }
      - { id: ingest_sealed_brief, kind: ingest, max_visits: 1 }
      - { id: author_company_plan, kind: plan, role_id: company_evidence_researcher, max_visits: 2 }
      - { id: validate_company_plan, kind: validate, max_visits: 2 }
      - { id: repair_company_plan, kind: plan, role_id: company_evidence_researcher, max_visits: 1 }
      # Match the ordinary company-research loop: a second context pass is
      # available only when the analyst names a new unresolved evidence need.
      - { id: query_context, kind: capability, capability_id: ontology.query_context, max_visits: 2 }
      - { id: ingest_company_evidence, kind: ingest, max_visits: 6 }
      - { id: assess_company_gaps, kind: assess, role_id: company_evidence_researcher, max_visits: 5 }
      - { id: targeted_query, kind: capability, capability_id: ontology.query, max_visits: 2 }
      - { id: trace_selected, kind: capability, capability_id: ontology.trace, max_visits: 1 }
      - { id: chain_selected, kind: capability, capability_id: ontology.chain, max_visits: 1 }
      - { id: author_agent_analysis, kind: plan, role_id: company_evidence_researcher, max_visits: 2 }
      - { id: validate_agent_analysis, kind: validate, max_visits: 2 }
      - { id: repair_review_analysis, kind: plan, role_id: company_evidence_researcher, max_visits: 1 }
