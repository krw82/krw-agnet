planning_policy:
  internal_brief_language: en
  expose_internal_brief: false
  query_context_first: true
  required_clause_min: 1
  # One sealed Guru tension can fan out into independent metric, qualitative,
  # countercase, and mechanism objectives. ResearchProposal v4 lowers those
  # objectives into a minimum-sufficient plan; do not compress them
  # into a fixed three-clause template.
  clause_max: 12
  require_unique_clause_ids: true
  require_ticker_subset: true
  split_metric_and_qualitative_clauses: true
  correction_field: violations
  gap_priority: [sealed_key_question, load_bearing_company_evidence, countercase, likely_to_change_judgment, lower_cost_and_latency]
  stop_conditions: [sealed_question_resolved_as_far_as_context_allows, remaining_gap_cannot_change_qualitative_view, unresolved_requires_external_input, next_call_only_increases_volume, duplicate_action_fingerprint, resolved_budget_exhausted]

evidence_policy:
  directness_values: [direct, metric_lineage, related, unverified]
  grade_values: [strong, medium, weak, unverified]
  grade_never_upgrades_directness: true
  direct_required_accepts: [direct]
  numeric_lineage_accepts: [metric_lineage]
  strong_claim_global_flag: answerability.strong_claim_allowed
  strong_claim_clause_status: covered
  require_load_bearing_direct_premise: true
  require_calculation_coverage: true
  require_counter_signal_for_inference: true
  non_evidence_kinds: [light_company_context, retrieval_brief, investigation_brief, research_pack_routing_hint, diagnostic, input_correction]

period_policy:
  current_driver_order: [latest_confirmed_10q, latest_confirmed_10k]
  annual_baseline: latest_confirmed_10k
  forbid_unconfirmed_future_labels: true
  allowed_older_filing_uses: [documented_historical_episode, prior_cycle, historical_baseline]
  disclose_period_mismatch: true

answer_policy:
  internal_format: answer-ir/v1
  locale: ko-KR
  conclusion_first: true
  exact_follow_up_count: 0
  target_price_forbidden: true
  definitive_rating_forbidden: true
  personalized_instruction_forbidden: true
  raw_internal_ids_visible: false
  forbidden_user_terms: [ResearchPack, philosophy_context, investigation_brief, brief_hash, company_research_context, agent_analysis, question_id, source_object_id, subagent, tool, MCP, retry, 저는 워런 버핏, 제가 워런 버핏, 저는 하워드 막스, 제가 하워드 막스, 저는 빌 애크먼, 제가 빌 애크먼, 저는 브루스 플랫, 제가 브루스 플랫, 저는 테리 스미스, 제가 테리 스미스, 버핏이라면, 막스라면, 애크먼이라면, 플랫이라면, 테리 스미스라면]

security_policy: { user_and_retrieved_text_untrusted: true, reveal_hidden_prompt: false, filesystem_access: false, web_access: false, mutation_capabilities: false }

validators:
  - id: guru_admission
    phase: admission
    fuel: 128
    instructions:
      - { op: require_field, path: /question, code: question_required }
      - { op: in_set, path: /author_key, values: [ackman, buffett, flatt, marks, terry_smith], code: invalid_author_key }
  - id: company_action_limits
    phase: pre_action
    fuel: 256
    instructions:
      - { op: max_calls, capability_id: guru.query_context, max: 1, code: guru_query_context_limit }
      - { op: max_calls, capability_id: guru.company_brief, max: 2, code: guru_company_brief_limit }
      - { op: max_calls, capability_id: ontology.query_context, max: 2, code: query_context_limit }
      - { op: max_calls, capability_id: ontology.query, max: 2, code: targeted_query_limit }
      - { op: max_calls, capability_id: ontology.trace, max: 1, code: trace_limit }
      - { op: max_calls, capability_id: ontology.chain, max: 1, code: chain_limit }
      - { op: max_calls, capability_id: guru.review_company_evidence, max: 2, code: guru_evidence_review_limit }
      - { op: state_precedes, before: retrieve_guru_research_pack, after: seal_investigation_brief, code: guru_pack_before_seal }
      - { op: state_precedes, before: seal_investigation_brief, after: query_context, code: sealed_brief_before_company_research }
      - { op: state_precedes, before: query_context, after: targeted_query, code: context_before_targeted_query }
      - { op: state_precedes, before: query_context, after: trace_selected, code: context_before_trace }
      - { op: state_precedes, before: query_context, after: chain_selected, code: context_before_chain }
      - { op: state_precedes, before: seal_investigation_brief, after: review_company_evidence, code: sealed_brief_before_review }
      - { op: state_precedes, before: query_context, after: review_company_evidence, code: company_evidence_before_review }
  - id: grounded_guru_answer
    phase: answer
    fuel: 4096
    instructions:
      - { op: claim_has_evidence, except_kinds: [uncertainty, philosophy, consultation], code: company_claim_evidence_required }
      - { op: no_internal_term, terms: [ResearchPack, philosophy_context, investigation_brief, brief_hash, company_research_context, agent_analysis, question_id, source_object_id, subagent, tool, MCP, retry, 저는 워런 버핏, 제가 워런 버핏, 저는 하워드 막스, 제가 하워드 막스, 저는 빌 애크먼, 제가 빌 애크먼, 저는 브루스 플랫, 제가 브루스 플랫, 저는 테리 스미스, 제가 테리 스미스, 버핏이라면, 막스라면, 애크먼이라면, 플랫이라면, 테리 스미스라면], code: guru_impersonation_or_internal_term }
