api_version: krw.agent/spec-v3
kind: AgentSpec

metadata:
  id: krw.research.ko
  version: 4.2.0
  description: Direct-authored Korean KRW filing research, earnings, scenario, and idea-screen programs.

entrypoints:
  company_research:
    run_kind: company_research
    locale: ko-KR
    workflow: company_research_v2
    # This is intentionally the full research envelope while we collect real
    # quality/usage traces. A later release may introduce a compact profile
    # from measured evidence; it must not silently constrain this baseline.
    required_budget_profile: company_research_full
    required_model_profile: flash_high
    scope: { allowed_context: company_ticker_set, cardinality: { kind: exact, value: 1 }, ticker_canonicalization: require_uppercase }
    constants: {}
  earnings_deep_dive:
    run_kind: earnings_deep_dive
    locale: ko-KR
    workflow: earnings_deep_dive_v1
    required_budget_profile: earnings_deep_dive
    required_model_profile: flash_high
    scope: { allowed_context: company_ticker_set, cardinality: { kind: exact, value: 1 }, ticker_canonicalization: require_uppercase }
    constants: {}
  scenario_sensitivity:
    run_kind: scenario_sensitivity
    locale: ko-KR
    workflow: scenario_sensitivity_v1
    required_budget_profile: scenario_sensitivity
    required_model_profile: flash_max
    scope: { allowed_context: company_ticker_set, cardinality: { kind: exact, value: 1 }, ticker_canonicalization: require_uppercase }
    constants: {}
  idea_generation:
    run_kind: idea_generation
    locale: ko-KR
    workflow: idea_generation_v1
    required_budget_profile: idea_generation
    required_model_profile: flash_max
    scope: { allowed_context: covered_universe, cardinality: { kind: max, value: 12 }, ticker_canonicalization: not_applicable }
    constants: {}

