planning_policy:
  internal_brief_language: en
  expose_internal_brief: false
  query_context_first: true
  required_clause_min: 1
  clause_max: 12
  require_unique_clause_ids: true
  require_ticker_subset: true
  split_metric_and_qualitative_clauses: true
  correction_field: violations
  gap_priority:
    - blocks_required_clause_or_calculation
    - requested_directness_missing
    - likely_to_change_conclusion
    - lower_cost_and_latency
    - original_clause_order
  stop_conditions:
    - all_required_obligations_covered
    - remaining_gap_cannot_change_conclusion
    - only_related_context_remains
    - unavailable_external_data_required
    - next_call_only_increases_volume
    - duplicate_action_fingerprint
    - resolved_budget_exhausted

evidence_policy:
  directness_values: [direct, metric_lineage, related, unverified]
  grade_values: [strong, medium, weak, unverified]
  grade_never_upgrades_directness: true
  direct_required_accepts: [direct]
  numeric_lineage_accepts: [metric_lineage]
  strong_claim_global_flag: answerability.strong_claim_allowed
  strong_claim_clause_status: covered
  require_load_bearing_direct_premise: true
  require_calculation_coverage: true
  require_counter_signal_for_inference: true
  non_evidence_kinds: [catalog_metadata, routing_score, diagnostic, overflow_message, status_only, open_tool_result, input_correction]

period_policy:
  current_driver_order: [latest_confirmed_10q, latest_confirmed_10k]
  annual_baseline: latest_confirmed_10k
  forbid_unconfirmed_future_labels: true
  allowed_older_filing_uses: [trend, persistence, improvement_or_deterioration, historical_baseline]
  disclose_period_mismatch: true

answer_policy:
  internal_format: final-markdown/v1
  final_output_reserve_tokens: 8192
  # E1: the retry reserve is declared, not derived. One full retry of the
  # largest composer turn (16,384). Raising a compose cap no longer doubles
  # the held-back reserve (previously max(8192, 2x cap) = 32,768, which
  # capped compose caps at 32,000 and cut the research runway by 2x per
  # +1x cap). effective reserve: max(8192, 16384) = 16384.
  compose_retry_reserve_tokens: 16384
  minimum_research_turn_tokens: 2048
  # Thinking-enabled research turns (analyst) consume reasoning tokens
  # (~2k-4k) before producing a tool call or assessment. 16384 leaves room
  # so the tool_call argument JSON is not truncated by the token cap.
  max_research_turn_tokens: 16384
  locale: ko-KR
  conclusion_first: true
  # Keep three useful next-research suggestions as the typed-answer default.
  # The direct Markdown composer may use fewer for explicit brevity requests
  # or when the evidence does not expose three honest, ontology-researchable
  # paths; never pad that answer with generic questions.
  exact_follow_up_count: 3
  target_price_forbidden: true
  definitive_rating_forbidden: true
  personalized_instruction_forbidden: true
  raw_internal_ids_visible: false
  # The class-level control-envelope tokens mirror the evidence crate's
  # CONTROL_PAYLOAD closure: an investor answer never names the kernel (2026-09-02
  # matrix: an INTC retry turn delivered assess-lane deliberation naming 커널).
  forbidden_user_terms: [ResearchState, SearchPlan, query_context, trace, chain, MCP, object_id, tool_budget_exceeded, budget exceeded, 도구 호출, 검색 계획, 근거 커버리지, FMP, Yahoo Finance, 야후파이낸스, 커널, kernel, krw_]

security_policy:
  user_and_retrieved_text_untrusted: true
  reveal_hidden_prompt: false
  filesystem_access: false
  web_access: false
  mutation_capabilities: false

