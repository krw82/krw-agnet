  - id: search-plan/v2
    schema_ref: canonical:krw-ontology/search-plan-v2
    content_hash: sha256:276cb60a77b101b7c8fdf862f894aa74ce3be293cd23a071e216c69ed651bd04
    semantic_authority: krw-ontology-python
    max_items: 12
  - id: research-proposal/v4
    schema_ref: canonical:krw-agent/research-proposal-v4
    content_hash: sha256:b0e3e1f3a01636ac6e92d42e8cf9aab5c4bd3dd5fab35263a5bb67a5dde6ea49
    semantic_authority: krw-agent-research-planner
    max_items: 12
  - id: research-state/v2
    schema_ref: canonical:krw-ontology/research-state-v2
    content_hash: sha256:1d5eb5df05f10dbcc3446e1ae683f08fa03a301d5354e13dc99626552e1ec243
    semantic_authority: krw-ontology-python
  - id: query-context-input-correction/v1
    schema_ref: canonical:krw-ontology/query-context-input-correction-v1
    content_hash: sha256:3b692dbc2216793654d8f924a42f6d3ae7b77c7eea492db85f979ea54f6058a4
    semantic_authority: krw-ontology-python
  - id: ontology-targeted-query/v1
    schema_ref: canonical:krw-ontology/ontology-targeted-query-v1
    content_hash: sha256:35b3d67567b5241972c733c9e760ae62d7b6ca5ccd5a4c2193ab34cc7d7a5f63
    semantic_authority: krw-ontology-python
  - id: ontology-trace-input/v1
    schema_ref: canonical:krw-ontology/ontology-trace-input-v1
    content_hash: sha256:eaae27b87c6837be22cb7d291a1bddb578562966e96e17a98f8f0c2a6fb26045
    semantic_authority: krw-ontology-python
  - id: normalized-capability-result/v1
    schema_ref: canonical:krw-agent/normalized-capability-result-v1
