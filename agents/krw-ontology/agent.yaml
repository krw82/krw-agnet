    semantic_authority: krw-agent-image

roles:
  - id: planner
    prompt_segments: [security_boundary, kernel_runtime, ontology_catalog, skill_catalog]
    deterministic: false
    # Planning is a closed tool-proposal task. Direct Flash avoids spending a
    # large hidden-thinking turn before the first immutable evidence lookup.
    # The planner skill body, proposal contract, and examples are loaded on
    # demand via skill.load (progressive disclosure) to keep the system prompt
    # compact.
    execution: { reasoning: direct, max_output_tokens: 2048 }
  - id: analyst
    prompt_segments: [security_boundary, kernel_runtime, ontology_catalog, skill_catalog]
    deterministic: false
    # Thinking-enabled role: reasoning tokens (~2k-4k) + tool_call/output (~2k-4k).
    # 16384 leaves headroom so the reasoning_content never starves the
    # tool_call argument assembly, which previously caused truncated JSON
    # (finish_reason: "length" → dependency_contract_failure).
    execution: { max_output_tokens: 16384 }
  - id: composer
    prompt_segments: [security_boundary, kernel_runtime, ontology_catalog, skill_catalog]
    deterministic: false
    execution: { reasoning: direct, max_output_tokens: 4096 }
  - id: earnings_planner
    prompt_segments: [security_boundary, kernel_runtime, ontology_catalog, skill_catalog]
    deterministic: false
    execution: { reasoning: direct, max_output_tokens: 2048 }
  - id: earnings_analyst
    prompt_segments: [security_boundary, kernel_runtime, ontology_catalog, skill_catalog]
    deterministic: false
    execution: { max_output_tokens: 16384 }
  - id: scenario_planner
    prompt_segments: [security_boundary, kernel_runtime, ontology_catalog, skill_catalog]
    deterministic: false
    execution: { reasoning: direct, max_output_tokens: 2048 }
  - id: scenario_analyst
    prompt_segments: [security_boundary, kernel_runtime, ontology_catalog, skill_catalog]
    deterministic: false
    execution: { max_output_tokens: 16384 }
  - id: idea_planner
    prompt_segments: [security_boundary, kernel_runtime, ontology_catalog, skill_catalog]
    deterministic: false
    execution: { reasoning: direct, max_output_tokens: 2048 }
  - id: idea_analyst
    prompt_segments: [security_boundary, kernel_runtime, ontology_catalog, skill_catalog]
    deterministic: false
    execution: { max_output_tokens: 16384 }
  - id: specialized_composer
    prompt_segments: [security_boundary, kernel_runtime, ontology_catalog, skill_catalog]
    deterministic: false
    execution: { reasoning: direct, max_output_tokens: 4096 }
  - id: verifier
    prompt_segments: []
    deterministic: true

prompt_segments:
  - { id: security_boundary, path: prompts/security-boundary.md, stable_prefix: true, private: true }
  - { id: kernel_runtime, path: skills/kernel-runtime/SKILL.md, stable_prefix: true, private: true }
  - { id: company_scope, path: prompts/company-scope.md, stable_prefix: true, private: true }
  - { id: research_scope, path: prompts/research-scope.md, stable_prefix: true, private: true }
  - { id: retrieval_planner, path: prompts/retrieval-planner.md, stable_prefix: true, private: true }
  - { id: research_planner_skill, path: skills/research-planner/SKILL.md, stable_prefix: true, private: true }
  - { id: provider_proposal_contract, path: skills/research-planner/references/provider-proposal-contract.md, stable_prefix: true, private: true }
  - { id: research_proposal_examples, path: skills/research-planner/references/research-proposal-examples.md, stable_prefix: true, private: true }
  - { id: research_recovery_loop, path: skills/research-planner/references/recovery-loop.md, stable_prefix: true, private: true }
  - { id: evidence_analyst, path: prompts/evidence-analyst.md, stable_prefix: true, private: true }
  - { id: research_synthesis, path: references/research-synthesis.md, stable_prefix: true, private: true }
  - { id: plain_korean_investor_language, path: references/plain-korean-investor-language.md, stable_prefix: true, private: true }
  - { id: final_markdown_contract, path: references/final-markdown-contract.md, stable_prefix: true, private: true }
  - { id: earnings_analysis, path: prompts/earnings-analysis.md, stable_prefix: false, private: true }
  - { id: scenario_analysis, path: prompts/scenario-analysis.md, stable_prefix: false, private: true }
  - { id: idea_screen, path: prompts/idea-screen.md, stable_prefix: false, private: true }
  - { id: specialized_answer, path: prompts/specialized-answer.md, stable_prefix: false, private: true }
  - id: ontology_catalog
    ontology_schema: { root_env: KRW_ONTOLOGY_ROOT, schemas: [metric_dictionary, quote_types, claim_types, risk_categories, objects] }
    stable_prefix: true
    private: true
  - id: skill_catalog
    skill_catalog: { skills_dirs: [skills, prompts, references] }
    stable_prefix: true
    private: true

capabilities:
  - id: ontology.query_context
    binding_key: krw_ontology_query_context
    permission: read
    input_contract: search-plan/v2
    model_input_contract: research-proposal/v4
    provider_input_codec: { kind: single_field_envelope_v1, field: proposal }
    input_derivation: { kind: research_proposal_to_search_plan_v4 }
    research_proposal_anchor: { kind: run_question }
    output_contracts: [research-state/v2, query-context-input-correction/v1, normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: research_state_v2
    research_action:
      kind: context
      estimate: { historical_success_lower_ppm: 550000, expected_duplicate_ppm: 100000, failure_risk_upper_ppm: 150000, expected_latency_ms: 1000, expected_tokens: 500, expected_tool_cost_micros: 2500, expected_result_bytes: 524288 }
      conflict_domain: research:ontology-context
    scope_binding:
      kind: trusted_ticker_set
      ticker_references:
        - { id: plan_tickers, pointer_pattern: /tickers, value_kind: string_array }
        - { id: clause_tickers, pointer_pattern: /clauses/*/tickers, value_kind: string_array }
      require_any_of: [plan_tickers]
      reject_non_null_pointers: [/universe]
    parallel_safe: false
    prerequisites: []
  - id: ontology.query
    binding_key: krw_ontology_query
    permission: read
    input_contract: ontology-targeted-query/v1
    output_contracts: [normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: targeted_evidence_v1
    research_action:
      kind: targeted
      estimate: { historical_success_lower_ppm: 600000, expected_duplicate_ppm: 100000, failure_risk_upper_ppm: 80000, expected_latency_ms: 500, expected_tokens: 300, expected_tool_cost_micros: 1500, expected_result_bytes: 262144 }
      conflict_domain: research:ontology-targeted
    scope_binding:
      kind: trusted_ticker_set
      ticker_references:
        - { id: ticker, pointer_pattern: /ticker, value_kind: string }
        - { id: tickers, pointer_pattern: /tickers, value_kind: string_array }
      require_any_of: [ticker, tickers]
    parallel_safe: false
    prerequisites: [ontology.query_context]
  - id: ontology.trace
    binding_key: krw_ontology_trace
    permission: read
    input_contract: ontology-trace-input/v1
    output_contracts: [normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: trace_lineage_v1
    research_action:
      kind: trace
      estimate: { historical_success_lower_ppm: 800000, expected_duplicate_ppm: 50000, failure_risk_upper_ppm: 40000, expected_latency_ms: 300, expected_tokens: 200, expected_tool_cost_micros: 1000, expected_result_bytes: 131072 }
      conflict_domain: research:ontology-trace
    scope_binding:
      kind: trusted_ticker_set
      ticker_references:
        - { id: ticker, pointer_pattern: /ticker, value_kind: string }
      require_any_of: [ticker]
    parallel_safe: false
    prerequisites: [ontology.query_context]
  - id: ontology.query_context_universe
    binding_key: krw_ontology_query_context
    permission: read
    input_contract: search-plan/v2
    model_input_contract: research-proposal/v4
    provider_input_codec: { kind: single_field_envelope_v1, field: proposal }
    input_derivation: { kind: research_proposal_to_search_plan_v4 }
    research_proposal_anchor: { kind: run_question }
    output_contracts: [research-state/v2, query-context-input-correction/v1, normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: research_state_v2
    research_action:
      kind: context
      estimate: { historical_success_lower_ppm: 550000, expected_duplicate_ppm: 100000, failure_risk_upper_ppm: 150000, expected_latency_ms: 1000, expected_tokens: 500, expected_tool_cost_micros: 2500, expected_result_bytes: 524288 }
      conflict_domain: research:ontology-context
    scope_binding:
      kind: covered_universe
      ticker_references:
        - { id: plan_tickers, pointer_pattern: /tickers, value_kind: string_array }
        - { id: clause_tickers, pointer_pattern: /clauses/*/tickers, value_kind: string_array }
      required_string_values: [{ pointer: /universe, value: covered }]
      bounded_integer_pointer: /limit_tickers
    parallel_safe: false
    prerequisites: []
  - id: ontology.query_universe
    binding_key: krw_ontology_query
    permission: read
    input_contract: ontology-targeted-query/v1
    output_contracts: [normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: targeted_evidence_v1
    research_action:
      kind: targeted
      estimate: { historical_success_lower_ppm: 600000, expected_duplicate_ppm: 100000, failure_risk_upper_ppm: 80000, expected_latency_ms: 500, expected_tokens: 300, expected_tool_cost_micros: 1500, expected_result_bytes: 262144 }
      conflict_domain: research:ontology-targeted
    scope_binding:
      kind: covered_universe
      ticker_references:
        - { id: ticker, pointer_pattern: /ticker, value_kind: string }
        - { id: tickers, pointer_pattern: /tickers, value_kind: string_array }
    parallel_safe: false
    prerequisites: [ontology.query_context_universe]
  - id: ontology.trace_universe
    binding_key: krw_ontology_trace
    permission: read
    input_contract: ontology-trace-input/v1
    output_contracts: [normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: trace_lineage_v1
    research_action:
      kind: trace
      estimate: { historical_success_lower_ppm: 800000, expected_duplicate_ppm: 50000, failure_risk_upper_ppm: 40000, expected_latency_ms: 300, expected_tokens: 200, expected_tool_cost_micros: 1000, expected_result_bytes: 131072 }
      conflict_domain: research:ontology-trace
    scope_binding:
      kind: covered_universe
      ticker_references:
        - { id: ticker, pointer_pattern: /ticker, value_kind: string }
    parallel_safe: false
    prerequisites: [ontology.query_context_universe]
  - id: ontology.chain
    binding_key: krw_ontology_chain
    permission: read
    # The chain tool accepts the same object_id + ticker envelope as
    # ontology.query, so the targeted-query input contract is reused. Extra
    # optional knobs (max_depth, direction) ride along without a new contract.
    input_contract: ontology-targeted-query/v1
    output_contracts: [normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: targeted_evidence_v1
    research_action:
      kind: targeted
      estimate: { historical_success_lower_ppm: 600000, expected_duplicate_ppm: 100000, failure_risk_upper_ppm: 80000, expected_latency_ms: 500, expected_tokens: 300, expected_tool_cost_micros: 1500, expected_result_bytes: 262144 }
      conflict_domain: research:ontology-chain
    scope_binding:
      kind: trusted_ticker_set
      ticker_references:
        - { id: ticker, pointer_pattern: /ticker, value_kind: string }
      require_any_of: [ticker]
    parallel_safe: false
    prerequisites: [ontology.query_context]
  - id: skill.load
    binding_key: krw_skill_local
    permission: read
    # Local skill-body lookup. The body is resolved from the immutable image
    # blob store (progressive disclosure); no MCP round trip occurs. The
    # capability binding is a placeholder so deployment-binding.yaml can pin
    # the tool schema hash, but the run-engine short-circuits execution.
    input_contract: skill-load/v1
    output_contracts: [skill-content/v1]
    idempotency: canonical_args
    result_ingest: skill_content_v1
    scope_binding: { kind: unscoped }
    parallel_safe: true
    prerequisites: []

workflows:
  - id: company_research_v2
    initial: accepted
    states:
      - { id: accepted, kind: start, max_visits: 1 }
      - { id: author_plan, kind: plan, role_id: planner, max_visits: 2 }
      - { id: validate_plan, kind: validate, max_visits: 2 }
      - { id: repair_plan, kind: plan, role_id: planner, max_visits: 1 }
      - { id: query_context, kind: capability, capability_id: ontology.query_context, max_visits: 2 }
      - { id: repair_server_violations, kind: plan, role_id: planner, max_visits: 1 }
      - { id: ingest_evidence, kind: ingest, max_visits: 5 }
      - { id: assess_obligations, kind: assess, role_id: analyst, max_visits: 6 }
      - { id: targeted_query, kind: capability, capability_id: ontology.query, max_visits: 2 }
      - { id: trace_selected, kind: capability, capability_id: ontology.trace, max_visits: 1 }
      - { id: compose_ir, kind: compose, role_id: composer, max_visits: 3 }
      - { id: verify_ir, kind: verify, max_visits: 3 }
      - { id: repair_ir, kind: compose, role_id: composer, max_visits: 2 }
      - { id: render_ko, kind: render, max_visits: 1 }
      - { id: commit, kind: commit, max_visits: 1 }
      - { id: succeeded, kind: terminal, terminal: succeeded, max_visits: 1 }
    transitions:
      - { from: accepted, on: begin, to: author_plan }
      - { from: author_plan, on: plan_ready, to: validate_plan }
      - { from: author_plan, on: proposal_contract_invalid, to: repair_plan }
      - { from: validate_plan, on: plan_invalid, to: repair_plan }
      - { from: validate_plan, on: plan_valid, to: query_context }
      - { from: repair_plan, on: plan_ready, to: validate_plan }
      - { from: query_context, on: correction_required, to: repair_server_violations }
      - { from: query_context, on: correction_unresolved, to: assess_obligations }
      - { from: query_context, on: evidence_observed, to: ingest_evidence }
      - { from: repair_server_violations, on: corrected, to: query_context }
      - { from: ingest_evidence, on: ingested, to: assess_obligations }
      - { from: ingest_evidence, on: output_budget_reserved, to: compose_ir }
      - { from: assess_obligations, on: precise_query_has_value, to: targeted_query }
      - { from: assess_obligations, on: selected_trace_has_value, to: trace_selected }
      - { from: assess_obligations, on: append_context_plan, to: query_context }
      - { from: assess_obligations, on: proposal_rejected, to: assess_obligations }
      - { from: assess_obligations, on: evidence_sufficient, to: compose_ir }
      - { from: assess_obligations, on: no_positive_value_action, to: compose_ir }
      - { from: assess_obligations, on: output_budget_reserved, to: compose_ir }
      - { from: targeted_query, on: evidence_observed, to: ingest_evidence }
      - { from: trace_selected, on: evidence_observed, to: ingest_evidence }
      - { from: compose_ir, on: draft_ready, to: verify_ir }
      - { from: verify_ir, on: repair_required, to: repair_ir }
      - { from: verify_ir, on: verified, to: render_ko }
      - { from: repair_ir, on: draft_ready, to: verify_ir }
      - { from: render_ko, on: rendered, to: commit }
      - { from: commit, on: committed, to: succeeded }

  - id: earnings_deep_dive_v1
    initial: accepted
    states:
      - { id: accepted, kind: start, max_visits: 1 }
      - { id: define_quarter_thesis, kind: plan, role_id: earnings_planner, max_visits: 1 }
      - { id: author_plan, kind: plan, role_id: earnings_planner, max_visits: 2 }
      - { id: validate_plan, kind: validate, max_visits: 2 }
      - { id: repair_plan, kind: plan, role_id: earnings_planner, max_visits: 1 }
      - { id: query_context, kind: capability, capability_id: ontology.query_context, max_visits: 2 }
      - { id: ingest_evidence, kind: ingest, max_visits: 5 }
      - { id: reconcile_periods_and_commentary, kind: assess, role_id: earnings_analyst, max_visits: 5 }
      - { id: targeted_query, kind: capability, capability_id: ontology.query, max_visits: 2 }
      - { id: trace_selected, kind: capability, capability_id: ontology.trace, max_visits: 1 }
      - { id: classify_thesis_change, kind: assess, role_id: earnings_analyst, max_visits: 2 }
      - { id: compose_ir, kind: compose, role_id: specialized_composer, max_visits: 2 }
      - { id: verify_ir, kind: verify, max_visits: 2 }
      - { id: repair_ir, kind: compose, role_id: specialized_composer, max_visits: 1 }
      - { id: render_ko, kind: render, max_visits: 1 }
      - { id: commit, kind: commit, max_visits: 1 }
      - { id: succeeded, kind: terminal, terminal: succeeded, max_visits: 1 }
    transitions:
      - { from: accepted, on: begin, to: define_quarter_thesis }
      - { from: define_quarter_thesis, on: thesis_ready, to: author_plan }
      - { from: author_plan, on: plan_ready, to: validate_plan }
      - { from: author_plan, on: proposal_contract_invalid, to: repair_plan }
      - { from: validate_plan, on: plan_invalid, to: repair_plan }
      - { from: validate_plan, on: plan_valid, to: query_context }
      - { from: repair_plan, on: plan_ready, to: validate_plan }
      - { from: query_context, on: correction_required, to: repair_plan }
      - { from: query_context, on: correction_unresolved, to: reconcile_periods_and_commentary }
      - { from: query_context, on: evidence_observed, to: ingest_evidence }
      - { from: ingest_evidence, on: ingested, to: reconcile_periods_and_commentary }
      - { from: ingest_evidence, on: output_budget_reserved, to: compose_ir }
      - { from: reconcile_periods_and_commentary, on: precise_query_has_value, to: targeted_query }
      - { from: reconcile_periods_and_commentary, on: selected_trace_has_value, to: trace_selected }
      - { from: reconcile_periods_and_commentary, on: append_context_plan, to: query_context }
      - { from: reconcile_periods_and_commentary, on: proposal_rejected, to: reconcile_periods_and_commentary }
      - { from: reconcile_periods_and_commentary, on: obligations_resolved, to: classify_thesis_change }
      - { from: reconcile_periods_and_commentary, on: external_input_required, to: classify_thesis_change }
      - { from: reconcile_periods_and_commentary, on: no_positive_value_action, to: classify_thesis_change }
      - { from: reconcile_periods_and_commentary, on: output_budget_reserved, to: compose_ir }
      - { from: targeted_query, on: evidence_observed, to: ingest_evidence }
      - { from: trace_selected, on: evidence_observed, to: ingest_evidence }
      - { from: classify_thesis_change, on: classified, to: compose_ir }
      - { from: classify_thesis_change, on: output_budget_reserved, to: compose_ir }
      - { from: compose_ir, on: draft_ready, to: verify_ir }
