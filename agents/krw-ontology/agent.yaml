capabilities:
  - id: ontology.query_context
    execution: { kind: remote, binding_key: krw_ontology_query_context }
    permission: read
    input_contract: search-plan/v2
    model_input_contract: research-proposal/v4
    provider_input_codec: { kind: single_field_envelope_v1, field: proposal }
    input_derivation: { kind: research_proposal_to_search_plan_v4 }
    research_proposal_anchor: { kind: run_question }
    output_contracts: [research-state/v2, query-context-input-correction/v1, normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: research_state_v2
    research_action:
      kind: context
      estimate: { historical_success_lower_ppm: 550000, expected_duplicate_ppm: 100000, failure_risk_upper_ppm: 150000, expected_latency_ms: 1000, expected_tokens: 500, expected_tool_cost_micros: 2500, expected_result_bytes: 524288 }
      conflict_domain: research:ontology-context
    scope_binding:
      kind: trusted_ticker_set
      ticker_references:
        - { id: plan_tickers, pointer_pattern: /tickers, value_kind: string_array }
        - { id: clause_tickers, pointer_pattern: /clauses/*/tickers, value_kind: string_array }
      require_any_of: [plan_tickers]
      reject_non_null_pointers: [/universe]
    parallel_safe: false
    prerequisites: []
  - id: ontology.company_context
    execution: { kind: remote, binding_key: krw_ontology_company_context }
    permission: read
    # The model sees only ticker plus optional topic filters. The kernel fixes
    # internal IDs off and the runtime returns a sanitized orientation map.
    input_contract: ontology-company-context/v1
    model_input_contract: company-context-request/v1
    input_derivation: { kind: company_context_request_v1 }
    output_contracts: [normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: company_context_v1
    scope_binding:
      kind: trusted_ticker_set
      ticker_references:
        - { id: ticker, pointer_pattern: /ticker, value_kind: string }
      require_any_of: [ticker]
    parallel_safe: false
    # Every company run reads this small ontology map before the first research
    # proposal. It is not evidence and never substitutes for filing retrieval.
    prerequisites: []
  - id: market.snapshot
    execution: { kind: remote, binding_key: krw_market_snapshot }
    permission: read
    # The ticker is the whole model input. The provider and cache policy are
    # kernel-owned, so this cannot become an arbitrary external fetch surface.
    input_contract: market-snapshot-request/v1
    output_contracts: [normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: market_snapshot_v1
    scope_binding:
      kind: trusted_ticker_set
      ticker_references:
        - { id: ticker, pointer_pattern: /ticker, value_kind: string }
      require_any_of: [ticker]
    parallel_safe: false
    prerequisites: [ontology.query_context]
  - id: ontology.query
    execution: { kind: remote, binding_key: krw_ontology_query }
    permission: read
    input_contract: ontology-targeted-query/v1
    output_contracts: [normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: targeted_evidence_v1
    research_action:
      kind: targeted
      estimate: { historical_success_lower_ppm: 600000, expected_duplicate_ppm: 100000, failure_risk_upper_ppm: 80000, expected_latency_ms: 500, expected_tokens: 300, expected_tool_cost_micros: 1500, expected_result_bytes: 262144 }
      conflict_domain: research:ontology-targeted
    scope_binding:
      kind: trusted_ticker_set
      ticker_references:
        - { id: ticker, pointer_pattern: /ticker, value_kind: string }
        - { id: tickers, pointer_pattern: /tickers, value_kind: string_array }
      require_any_of: [ticker, tickers]
    parallel_safe: false
    prerequisites: [ontology.query_context]
  - id: ontology.trace
    execution: { kind: remote, binding_key: krw_ontology_trace }
    permission: read
    input_contract: ontology-trace-input/v1
    output_contracts: [normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: trace_lineage_v1
    research_action:
      kind: trace
      estimate: { historical_success_lower_ppm: 800000, expected_duplicate_ppm: 50000, failure_risk_upper_ppm: 40000, expected_latency_ms: 300, expected_tokens: 200, expected_tool_cost_micros: 1000, expected_result_bytes: 131072 }
      conflict_domain: research:ontology-trace
    scope_binding:
      kind: trusted_ticker_set
      ticker_references:
        - { id: ticker, pointer_pattern: /ticker, value_kind: string }
      require_any_of: [ticker]
    parallel_safe: false
    prerequisites: [ontology.query_context]
  - id: ontology.query_context_universe
    execution: { kind: remote, binding_key: krw_ontology_query_context }
    permission: read
    input_contract: search-plan/v2
    model_input_contract: research-proposal/v4
    provider_input_codec: { kind: single_field_envelope_v1, field: proposal }
    input_derivation: { kind: research_proposal_to_search_plan_v4 }
    research_proposal_anchor: { kind: run_question }
    output_contracts: [research-state/v2, query-context-input-correction/v1, normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: research_state_v2
    research_action:
      kind: context
      estimate: { historical_success_lower_ppm: 550000, expected_duplicate_ppm: 100000, failure_risk_upper_ppm: 150000, expected_latency_ms: 1000, expected_tokens: 500, expected_tool_cost_micros: 2500, expected_result_bytes: 524288 }
      conflict_domain: research:ontology-context
    scope_binding:
      kind: covered_universe
      ticker_references:
        - { id: plan_tickers, pointer_pattern: /tickers, value_kind: string_array }
        - { id: clause_tickers, pointer_pattern: /clauses/*/tickers, value_kind: string_array }
      required_string_values: [{ pointer: /universe, value: covered }]
      bounded_integer_pointer: /limit_tickers
    parallel_safe: false
    prerequisites: []
  - id: ontology.query_universe
    execution: { kind: remote, binding_key: krw_ontology_query }
    permission: read
    input_contract: ontology-targeted-query/v1
    output_contracts: [normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: targeted_evidence_v1
    research_action:
      kind: targeted
      estimate: { historical_success_lower_ppm: 600000, expected_duplicate_ppm: 100000, failure_risk_upper_ppm: 80000, expected_latency_ms: 500, expected_tokens: 300, expected_tool_cost_micros: 1500, expected_result_bytes: 262144 }
      conflict_domain: research:ontology-targeted
    scope_binding:
      kind: covered_universe
      ticker_references:
        - { id: ticker, pointer_pattern: /ticker, value_kind: string }
        - { id: tickers, pointer_pattern: /tickers, value_kind: string_array }
    parallel_safe: false
    prerequisites: [ontology.query_context_universe]
  - id: ontology.trace_universe
    execution: { kind: remote, binding_key: krw_ontology_trace }
    permission: read
    input_contract: ontology-trace-input/v1
    output_contracts: [normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: trace_lineage_v1
    research_action:
      kind: trace
      estimate: { historical_success_lower_ppm: 800000, expected_duplicate_ppm: 50000, failure_risk_upper_ppm: 40000, expected_latency_ms: 300, expected_tokens: 200, expected_tool_cost_micros: 1000, expected_result_bytes: 131072 }
      conflict_domain: research:ontology-trace
    scope_binding:
      kind: covered_universe
      ticker_references:
        - { id: ticker, pointer_pattern: /ticker, value_kind: string }
    parallel_safe: false
    prerequisites: [ontology.query_context_universe]
  - id: ontology.chain
    execution: { kind: remote, binding_key: krw_ontology_chain }
    permission: read
    # Chain is an object-centered follow-up.  Its physical MCP surface is
    # object_id + ticker (with server-side depth/direction defaults), so use
    # the pinned trace envelope rather than the search/query envelope.
    input_contract: ontology-trace-input/v1
    output_contracts: [normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: trace_lineage_v1
    research_action:
      kind: trace
      estimate: { historical_success_lower_ppm: 700000, expected_duplicate_ppm: 50000, failure_risk_upper_ppm: 50000, expected_latency_ms: 500, expected_tokens: 300, expected_tool_cost_micros: 1500, expected_result_bytes: 262144 }
      conflict_domain: research:ontology-chain
    scope_binding:
      kind: trusted_ticker_set
      ticker_references:
        - { id: ticker, pointer_pattern: /ticker, value_kind: string }
      require_any_of: [ticker]
    parallel_safe: false
    prerequisites: [ontology.query_context]
  - id: skill.load
    execution: { kind: local, builtin: skill_load }
    permission: read
    # Local skill-body lookup. The body is resolved from the immutable image
    # blob store (progressive disclosure); no MCP round trip occurs.
    input_contract: skill-load/v1
    output_contracts: [skill-content/v1, normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: skill_content_v1
    scope_binding: { kind: unscoped }
    parallel_safe: true
    prerequisites: []
workflows:
  - id: company_research_v2
    initial: accepted
    states:
      - { id: accepted, kind: start, max_visits: 1 }
      # This is an orientation decision, not a ResearchProposal authoring
      # phase.  Keeping it as assess prevents the planner-only proposal
      # validators from being applied to the small company-context request.
      - { id: orient_company, kind: assess, role_id: company_orienter, max_visits: 1 }
      - { id: company_context, kind: capability, capability_id: ontology.company_context, max_visits: 1 }
      - { id: ingest_company_orientation, kind: ingest, max_visits: 1 }
      - { id: author_plan, kind: plan, role_id: planner, max_visits: 1 }
      - { id: validate_plan, kind: validate, max_visits: 2 }
      - { id: repair_plan, kind: plan, role_id: planner, max_visits: 1 }
      - { id: query_context, kind: capability, capability_id: ontology.query_context, max_visits: 2 }
      - { id: repair_server_violations, kind: plan, role_id: planner, max_visits: 1 }
      # This is a kernel builtin (not an additional model turn). It must be
      # able to accept every already-advertised evidence-producing read:
      # query_context x2, targeted query x2, trace, chain, and market x1.
      - { id: ingest_evidence, kind: ingest, max_visits: 7 }
      - { id: assess_obligations, kind: assess, role_id: analyst, max_visits: 3 }
      - { id: market_snapshot, kind: capability, capability_id: market.snapshot, max_visits: 1 }
      # A broad company question can have two independent, material evidence
      # gaps (for example, revenue mix and cash conversion). The analyst may
      # still stop after zero or one query; this only leaves room for a second
      # exact follow-up when the first result changes the remaining frontier.
      - { id: targeted_query, kind: capability, capability_id: ontology.query, max_visits: 2 }
      - { id: trace_selected, kind: capability, capability_id: ontology.trace, max_visits: 1 }
      # The analyst skill uses chain only when an observed record needs its
      # causal/business context. Keep this as a separate bounded capability
      # state so it is advertised only after evidence has been ingested.
      - { id: chain_selected, kind: capability, capability_id: ontology.chain, max_visits: 1 }
      - { id: compose_ir, kind: compose, role_id: composer, max_visits: 2 }
      - { id: verify_ir, kind: verify, max_visits: 2 }
      - { id: repair_ir, kind: compose, role_id: composer, max_visits: 1 }
      - { id: render_ko, kind: render, max_visits: 1 }
      - { id: commit, kind: commit, max_visits: 1 }
      - { id: succeeded, kind: terminal, terminal: succeeded, max_visits: 1 }
    transitions:
      - { from: accepted, on: begin, to: orient_company }
      - { from: orient_company, on: orientation_ready, to: company_context }
      - { from: orient_company, on: output_budget_reserved, to: compose_ir }
      - { from: company_context, on: evidence_observed, to: ingest_company_orientation }
      - { from: ingest_company_orientation, on: ingested, to: author_plan }
      - { from: ingest_company_orientation, on: output_budget_reserved, to: compose_ir }
      - { from: author_plan, on: plan_ready, to: validate_plan }
      - { from: author_plan, on: proposal_contract_invalid, to: repair_plan }
      - { from: validate_plan, on: plan_invalid, to: repair_plan }
      - { from: validate_plan, on: plan_valid, to: query_context }
      - { from: repair_plan, on: plan_ready, to: validate_plan }
      - { from: query_context, on: correction_required, to: repair_server_violations }
      - { from: query_context, on: correction_unresolved, to: assess_obligations }
      - { from: query_context, on: evidence_observed, to: ingest_evidence }
      - { from: repair_server_violations, on: corrected, to: query_context }
      - { from: ingest_evidence, on: ingested, to: assess_obligations }
      - { from: ingest_evidence, on: output_budget_reserved, to: compose_ir }
      - { from: assess_obligations, on: market_snapshot_has_value, to: market_snapshot }
      - { from: assess_obligations, on: precise_query_has_value, to: targeted_query }
      - { from: assess_obligations, on: selected_trace_has_value, to: trace_selected }
      - { from: assess_obligations, on: selected_chain_has_value, to: chain_selected }
      - { from: assess_obligations, on: append_context_plan, to: query_context }
      - { from: assess_obligations, on: evidence_sufficient, to: compose_ir }
      - { from: assess_obligations, on: no_positive_value_action, to: compose_ir }
      - { from: assess_obligations, on: output_budget_reserved, to: compose_ir }
      - { from: targeted_query, on: evidence_observed, to: ingest_evidence }
      - { from: trace_selected, on: evidence_observed, to: ingest_evidence }
      - { from: chain_selected, on: evidence_observed, to: ingest_evidence }
      - { from: market_snapshot, on: evidence_observed, to: ingest_evidence }
      - { from: compose_ir, on: draft_ready, to: verify_ir }
      - { from: verify_ir, on: repair_required, to: repair_ir }
      - { from: verify_ir, on: verified, to: render_ko }
      - { from: repair_ir, on: draft_ready, to: verify_ir }
      - { from: render_ko, on: rendered, to: commit }
      - { from: commit, on: committed, to: succeeded }

