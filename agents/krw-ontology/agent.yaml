roles:
  - id: company_orienter
    # A small, company-specific ontology map is fetched before the planner
    # sees the question. It is orientation only: it gives the planner useful
    # vocabulary and connections without pre-deciding a conclusion.
    prompt_segments: [security_boundary, kernel_runtime, ontology_catalog, company_scope, company_ontology_orientation]
    deterministic: false
    execution: { reasoning: direct, max_output_tokens: 512 }
  - id: planner
    # The planner's primary skill is role-scoped, so it is available on the
    # first turn without asking the model to make a preliminary skill.load
    # call.
    prompt_segments: [security_boundary, kernel_runtime, ontology_catalog, planner_skill_catalog, research_planner_skill]
    deterministic: false
    # Planning is a closed tool-proposal task. GLM direct mode avoids spending a
    # large hidden-thinking turn before the first immutable evidence lookup.
    # A multi-objective ResearchProposal is itself nested JSON, so it needs
    # enough room to finish the tool arguments instead of being cut mid-call.
    # This is still far below the analyst budget and applies only to the
    # planner's one direct proposal turn.
    execution: { reasoning: direct, max_output_tokens: 8192 }
  - id: analyst
    # The long research-analysis contract is core context for every ordinary
    # company analyst turn. References remain progressive-disclosure material.
    prompt_segments: [security_boundary, kernel_runtime, ontology_catalog, company_skill_catalog, evidence_analyst, research_analysis]
    deterministic: false
    # Thinking-enabled role for evidence analysis. GLM bills private thinking
    # and the following capability decision against one output ceiling. The
    # company workflow can hold many evidence obligations at once, so this
    # role must use the image policy's full 16,384-token research-turn budget:
    # 8,192 cut a real multi-objective analysis off before its tool decision.
    # This changes no workflow step or tool allowance; it gives the existing
    # analysis turn enough room to finish.
    execution: { reasoning: standard, max_output_tokens: 16384 }
  - id: composer
    # The composer cannot call capabilities or load more skills. Giving it the
    # ontology/skill catalogs only consumes context and exposes backend
    # vocabulary that can leak into investor prose; it writes from the
    # compacted evidence projection and these answer-writing references.
    prompt_segments: [security_boundary, kernel_runtime, research_synthesis, plain_korean_investor_language, final_markdown_contract]
    deterministic: false
    # Evidence selection and gap analysis are complete before this state.
    # Composition is a compute task — section structure, arithmetic
    # narration, and counter-hedging in one pass — so thinking stays enabled
    # (release A′). The cap stays 16,384: the kernel's admission math holds
    # at max(8192, 2x cap) = 32,768 and every budget tail passes, while any
    # larger cap either fails image compile or collapses the research
    # runway. GLM bills thinking and visible output against this one
    # ceiling; a halved visible worst case lands in the bounded direct-retry
    # lane instead of a truncated answer.
    execution: { reasoning: standard, max_output_tokens: 16384 }
  - id: earnings_planner
    prompt_segments: [security_boundary, kernel_runtime, ontology_catalog, planner_skill_catalog, research_planner_skill]
    deterministic: false
    execution: { reasoning: direct, max_output_tokens: 8192 }
  - id: earnings_analyst
    prompt_segments: [security_boundary, kernel_runtime, ontology_catalog, earnings_skill_catalog, evidence_analyst, earnings_analysis]
    deterministic: false
    execution: { reasoning: standard, max_output_tokens: 8192 }
  - id: scenario_planner
    prompt_segments: [security_boundary, kernel_runtime, ontology_catalog, planner_skill_catalog, research_planner_skill]
    deterministic: false
    execution: { reasoning: direct, max_output_tokens: 8192 }
  - id: scenario_analyst
    prompt_segments: [security_boundary, kernel_runtime, ontology_catalog, scenario_skill_catalog, evidence_analyst, scenario_analysis]
    deterministic: false
    execution: { reasoning: standard, max_output_tokens: 8192 }
  - id: idea_planner
    prompt_segments: [security_boundary, kernel_runtime, ontology_catalog, idea_skill_catalog, research_planner_skill, research_scope]
    deterministic: false
    execution: { reasoning: direct, max_output_tokens: 8192 }
  - id: idea_analyst
    prompt_segments: [security_boundary, kernel_runtime, ontology_catalog, idea_skill_catalog, evidence_analyst, idea_screen]
    deterministic: false
    execution: { reasoning: standard, max_output_tokens: 8192 }
  - id: wide_planner
    prompt_segments: [security_boundary, kernel_runtime, ontology_catalog, wide_skill_catalog, research_planner_skill, research_scope]
    deterministic: false
    execution: { reasoning: direct, max_output_tokens: 8192 }
  - id: wide_analyst
    prompt_segments: [security_boundary, kernel_runtime, ontology_catalog, wide_skill_catalog, evidence_analyst, wide_research_analysis]
    deterministic: false
    execution: { reasoning: standard, max_output_tokens: 8192 }
  - id: earnings_composer
    prompt_segments: [security_boundary, kernel_runtime, research_synthesis, plain_korean_investor_language, final_markdown_contract, specialized_answer, earnings_output_contract]
    deterministic: false
    execution: { reasoning: direct, max_output_tokens: 16384 }
  - id: scenario_composer
    prompt_segments: [security_boundary, kernel_runtime, research_synthesis, plain_korean_investor_language, final_markdown_contract, specialized_answer, scenario_output_contract]
    deterministic: false
    execution: { reasoning: direct, max_output_tokens: 16384 }
  - id: idea_composer
    prompt_segments: [security_boundary, kernel_runtime, research_synthesis, plain_korean_investor_language, final_markdown_contract, specialized_answer, idea_output_contract]
    deterministic: false
    execution: { reasoning: direct, max_output_tokens: 16384 }
  - id: wide_composer
    prompt_segments: [security_boundary, kernel_runtime, research_synthesis, plain_korean_investor_language, final_markdown_contract, wide_research_output_contract]
    deterministic: false
    execution: { reasoning: direct, max_output_tokens: 16384 }
  - id: verifier
    prompt_segments: []
    deterministic: true

