capabilities:
  - id: ontology.query_context
    execution: { kind: remote, binding_key: krw_ontology_query_context }
    permission: read
    input_contract: search-plan/v2
    model_input_contract: research-proposal/v4
    provider_input_codec: { kind: single_field_envelope_v1, field: proposal }
    input_derivation: { kind: research_proposal_to_search_plan_v4 }
    research_proposal_anchor: { kind: run_question }
    output_contracts: [research-state/v2, query-context-input-correction/v1, normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: research_state_v2
    research_action:
      kind: context
      estimate: { historical_success_lower_ppm: 550000, expected_duplicate_ppm: 100000, failure_risk_upper_ppm: 150000, expected_latency_ms: 1000, expected_tokens: 500, expected_tool_cost_micros: 2500, expected_result_bytes: 524288 }
      conflict_domain: research:ontology-context
    scope_binding:
      kind: trusted_ticker_set
      ticker_references:
        - { id: plan_tickers, pointer_pattern: /tickers, value_kind: string_array }
        - { id: clause_tickers, pointer_pattern: /clauses/*/tickers, value_kind: string_array }
      require_any_of: [plan_tickers]
      reject_non_null_pointers: [/universe]
    parallel_safe: false
    prerequisites: []
  - id: ontology.company_context
    execution: { kind: remote, binding_key: krw_ontology_company_context }
    permission: read
    # The model sees only ticker plus optional topic filters. The kernel fixes
    # internal IDs off and the runtime returns a sanitized orientation map.
    input_contract: ontology-company-context/v1
    model_input_contract: company-context-request/v1
    input_derivation: { kind: company_context_request_v1 }
    output_contracts: [normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: company_context_v1
    scope_binding:
      kind: trusted_ticker_set
      ticker_references:
        - { id: ticker, pointer_pattern: /ticker, value_kind: string }
      require_any_of: [ticker]
    parallel_safe: false
    # Every company run reads this small ontology map before the first research
    # proposal. It is not evidence and never substitutes for filing retrieval.
    prerequisites: []
  - id: market.snapshot
    execution: { kind: remote, binding_key: krw_market_snapshot }
    permission: read
    # The ticker is the whole model input. The provider and cache policy are
    # kernel-owned, so this cannot become an arbitrary external fetch surface.
    input_contract: market-snapshot-request/v1
    output_contracts: [normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: market_snapshot_v1
    scope_binding:
      kind: market_plane
      ticker_references:
        - { id: ticker, pointer_pattern: /ticker, value_kind: string }
      require_any_of: [ticker]
    parallel_safe: false
    prerequisites: [ontology.query_context]
  # Observation-plane series reads over the immutable observation store. Like
  # the snapshot they are advisory_only research context: the result is never
  # filing evidence and never supports a target price or recommendation. They
  # carry no research_action policy for the same reason as the snapshot: the
  # planner's action kinds are closed to the canonical query/trace surfaces.
  - id: market.series
    execution: { kind: remote, binding_key: krw_market_series }
    permission: read
    # One already trusted ticker plus one canonical metric id. The kernel owns
    # the store/cache policy, so this cannot become an arbitrary fetch surface.
    input_contract: market-series-request/v1
    output_contracts: [normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: market_series_v1
    scope_binding:
      kind: market_plane
      ticker_references:
        - { id: ticker, pointer_pattern: /ticker, value_kind: string }
      require_any_of: [ticker]
    parallel_safe: false
    prerequisites: [ontology.query_context]
  - id: macro.series
    execution: { kind: remote, binding_key: krw_macro_series }
    permission: read
    # Macro indicator series are not company-scoped: the model names only a
    # canonical metric id and a bounded limit, so no ticker scope exists to
    # bind. The kernel-owned metric allowlist keeps the read bounded.
    input_contract: macro-series-request/v1
    output_contracts: [normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: macro_series_v1
    scope_binding: { kind: unscoped }
    parallel_safe: false
    prerequisites: [ontology.query_context]
  # Curated external openbb-mcp data plane (closed three-tool starter set).
  # The planner's action kinds stay closed to the canonical query/trace
  # surfaces for the macro tools: unscoped reads have no clause-scoped
  # mapping, so they ride the direct assess lane (with the kernel cross-
  # plane hint) instead of the scored planner lane. The ticker-scoped price
  # tool carries the observation action like the round-2 company plane.
  # The kernel pins the transport provider during input derivation; the
  # model never sees a vendor name.
  - id: openbb.price_history
    execution: { kind: remote, binding_key: openbb_equity_price_historical }
    permission: read
    input_contract: openbb-price-historical-input/v1
    model_input_contract: openbb-price-history-request/v1
    input_derivation: { kind: openbb_request_v1, pinned_provider: fmp }
    output_contracts: [normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: openbb_series_v1
    research_action:
      kind: observation
      estimate:
        historical_success_lower_ppm: 850000
        expected_duplicate_ppm: 30000
        failure_risk_upper_ppm: 120000
        expected_latency_ms: 2500
        expected_tokens: 2500
        expected_tool_cost_micros: 500
        expected_result_bytes: 12288
      conflict_domain: openbb.equity_price_historical
    scope_binding:
      kind: market_plane
      ticker_references:
        - { id: symbol, pointer_pattern: /symbol, value_kind: string }
      require_any_of: [symbol]
    parallel_safe: false
    prerequisites: [ontology.query_context]
  - id: openbb.macro_series
    execution: { kind: remote, binding_key: openbb_economy_fred_series }
    permission: read
    # FRED macro series are not company-scoped: the model names only a FRED
    # series id, an optional date window, and a bounded observation limit.
    input_contract: openbb-fred-series-input/v1
    model_input_contract: openbb-macro-series-request/v1
    input_derivation: { kind: openbb_request_v1, pinned_provider: fred }
    output_contracts: [normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: openbb_series_v1
    scope_binding: { kind: unscoped }
    parallel_safe: false
    prerequisites: [ontology.query_context]
  - id: openbb.macro_cpi
    execution: { kind: remote, binding_key: openbb_economy_cpi }
    permission: read
    # CPI backdrop (country/transform/frequency knobs, kernel-pinned
    # defaults). Not company-scoped.
    input_contract: openbb-cpi-input/v1
    model_input_contract: openbb-cpi-request/v1
    # OECD serves the same harmonised CPI keylessly (FRED requires an absent
    # fred_api_key on this plane); transform=yoy returns the annual inflation
    # rate directly (2026-09-02 probe).
    input_derivation: { kind: openbb_request_v1, pinned_provider: oecd }
    output_contracts: [normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: openbb_series_v1
    scope_binding: { kind: unscoped }
    parallel_safe: false
    prerequisites: [ontology.query_context]
  # ── openbb curation round 2: company plane (financial-services patterns) ──
  # Same doctrine as the round-1 trio: advisory_only observation reads with
  # the kernel-pinned fmp transport, ticker-scoped bindings so a payload can
  # never fabricate an entity. Round 2 also declares the observation research
  # action (planner-selectable when a frontier clause shares the trusted
  # ticker): estimates are image-pinned reviewable fallbacks; the filing
  # reads keep every directness/calculation bonus, so an observation informs
  # a clause but never outcompetes its filing resolution.
  - id: openbb.quote
    execution: { kind: remote, binding_key: openbb_equity_price_quote }
    permission: read
    # One current-quote snapshot for the already trusted ticker.
    input_contract: openbb-quote-input/v1
    model_input_contract: openbb-quote-request/v1
    input_derivation: { kind: openbb_request_v1, pinned_provider: fmp }
    output_contracts: [normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: openbb_series_v1
    research_action:
      kind: observation
      estimate:
        historical_success_lower_ppm: 900000
        expected_duplicate_ppm: 20000
        failure_risk_upper_ppm: 100000
        expected_latency_ms: 1500
        expected_tokens: 600
        expected_tool_cost_micros: 300
        expected_result_bytes: 2048
      conflict_domain: openbb.equity_price_quote
    scope_binding:
      kind: market_plane
      ticker_references:
        - { id: symbol, pointer_pattern: /symbol, value_kind: string }
      require_any_of: [symbol]
    parallel_safe: false
    prerequisites: [ontology.query_context]
  - id: openbb.metrics
    execution: { kind: remote, binding_key: openbb_equity_fundamental_metrics }
    permission: read
    # Bounded TTM key-metric snapshots (margins, multiples, capital returns).
    input_contract: openbb-metrics-input/v1
    model_input_contract: openbb-metrics-request/v1
    input_derivation: { kind: openbb_request_v1, pinned_provider: fmp }
    output_contracts: [normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: openbb_series_v1
    research_action:
      kind: observation
      estimate:
        historical_success_lower_ppm: 850000
        expected_duplicate_ppm: 30000
        failure_risk_upper_ppm: 120000
        expected_latency_ms: 2500
        expected_tokens: 2000
        expected_tool_cost_micros: 500
        expected_result_bytes: 8192
      conflict_domain: openbb.equity_fundamental_metrics
    scope_binding:
      kind: market_plane
      ticker_references:
        - { id: symbol, pointer_pattern: /symbol, value_kind: string }
      require_any_of: [symbol]
    parallel_safe: false
    prerequisites: [ontology.query_context]
  - id: openbb.income_statement
    execution: { kind: remote, binding_key: openbb_equity_fundamental_income }
    permission: read
    # Bounded income statements; the kernel pins the default period count.
    input_contract: openbb-income-input/v1
    model_input_contract: openbb-income-request/v1
    input_derivation: { kind: openbb_request_v1, pinned_provider: fmp }
    output_contracts: [normalized-capability-result/v1]
    idempotency: canonical_args
    result_ingest: openbb_series_v1
    research_action:
      kind: observation
      estimate:
        historical_success_lower_ppm: 850000
        expected_duplicate_ppm: 30000
