    idempotency: canonical_args
    result_ingest: skill_content_v1
    scope_binding: { kind: unscoped }
    parallel_safe: true
    prerequisites: []
workflows:
  - id: company_research_v2
    initial: accepted
    states:
      - { id: accepted, kind: start, max_visits: 1 }
      # This is an orientation decision, not a ResearchProposal authoring
      # phase.  Keeping it as assess prevents the planner-only proposal
      # validators from being applied to the small company-context request.
      - { id: orient_company, kind: assess, role_id: company_orienter, max_visits: 1 }
      - { id: company_context, kind: capability, capability_id: ontology.company_context, max_visits: 1 }
      - { id: ingest_company_orientation, kind: ingest, max_visits: 1 }
      - { id: author_plan, kind: plan, role_id: planner, max_visits: 1 }
      - { id: validate_plan, kind: validate, max_visits: 2 }
      - { id: repair_plan, kind: plan, role_id: planner, max_visits: 1 }
      - { id: query_context, kind: capability, capability_id: ontology.query_context, max_visits: 2 }
      - { id: repair_server_violations, kind: plan, role_id: planner, max_visits: 1 }
      # This is a kernel builtin (not an additional model turn). It must be
      # able to accept every already-advertised evidence-producing read:
      # query_context x2, targeted query x2, trace, chain, market x1, each
      # of the five event/news ladder reads x1, the two observation series
      # lookups x1, the three curated openbb lookups x1, and the round-3
      # openbb filings lookup x1.
      - { id: ingest_evidence, kind: ingest, max_visits: 29 }
      - { id: assess_obligations, kind: assess, role_id: analyst, max_visits: 3 }
      - { id: market_snapshot, kind: capability, capability_id: market.snapshot, max_visits: 1 }
      # Observation-plane series lookups (advisory market/macro backdrop).
      # Each lookup is one bounded read; action_limits still allows two calls
      # per capability as a second validator layer below the state bound.
      - { id: market_series_lookup, kind: capability, capability_id: market.series, max_visits: 1 }
      - { id: macro_series_lookup, kind: capability, capability_id: macro.series, max_visits: 1 }
      # Curated external openbb lookups (advisory live-data fallback for the
      # same market/macro backdrop). Same one-visit state bound as the
      # store-backed series lookups, with action_limits as the second layer.
      - { id: openbb_price_lookup, kind: capability, capability_id: openbb.price_history, max_visits: 1 }
      - { id: openbb_macro_lookup, kind: capability, capability_id: openbb.macro_series, max_visits: 1 }
      - { id: openbb_cpi_lookup, kind: capability, capability_id: openbb.macro_cpi, max_visits: 1 }
      # Curated openbb round 2 (financial-services patterns): quote,
      # fundamentals, statements, consensus, peers, and the earnings calendar
      # for the company plane; the yield curve and macro calendar for the
      # macro plane. Same one-visit state bound and action_limits layer.
      - { id: openbb_quote_lookup, kind: capability, capability_id: openbb.quote, max_visits: 1 }
      - { id: openbb_metrics_lookup, kind: capability, capability_id: openbb.metrics, max_visits: 1 }
      - { id: openbb_income_lookup, kind: capability, capability_id: openbb.income_statement, max_visits: 1 }
      - { id: openbb_balance_lookup, kind: capability, capability_id: openbb.balance_statement, max_visits: 1 }
      - { id: openbb_cash_lookup, kind: capability, capability_id: openbb.cash_statement, max_visits: 1 }
      - { id: openbb_consensus_lookup, kind: capability, capability_id: openbb.consensus, max_visits: 1 }
      - { id: openbb_peers_lookup, kind: capability, capability_id: openbb.peers, max_visits: 1 }
      - { id: openbb_earnings_calendar_lookup, kind: capability, capability_id: openbb.earnings_calendar, max_visits: 1 }
      - { id: openbb_yield_curve_lookup, kind: capability, capability_id: openbb.yield_curve, max_visits: 1 }
      - { id: openbb_macro_calendar_lookup, kind: capability, capability_id: openbb.macro_calendar, max_visits: 1 }
      # Round-3: FMP filings list for the trusted ticker (the filing record
      # when the issuer sits outside the ontology catalog).
      - { id: openbb_filings_lookup, kind: capability, capability_id: openbb.filings, max_visits: 1 }
      # Deterministic valuation computation (advisory artifact, no ledger
      # entries): the analyst supplies labeled inputs, the engine computes.
      - { id: quant_dcf_lookup, kind: capability, capability_id: quant.dcf, max_visits: 1 }
      # A broad company question can have two independent, material evidence
      # gaps (for example, revenue mix and cash conversion). The analyst may
      # still stop after zero or one query; this only leaves room for a second
      # exact follow-up when the first result changes the remaining frontier.
      - { id: targeted_query, kind: capability, capability_id: ontology.query, max_visits: 2 }
      - { id: trace_selected, kind: capability, capability_id: ontology.trace, max_visits: 1 }
      # The analyst skill uses chain only when an observed record needs its
