[project]
name = "openbb-gateway"
version = "0.1.0"
description = "OpenBB gateway for the KRW engine: readiness-fingerprint MCP adapter and workspace widget publisher"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
openbb-gateway-adapter = "openbb_gateway.adapter:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openbb_gateway"]

[tool.ruff]
line-length = 100
target-version = "py311"
