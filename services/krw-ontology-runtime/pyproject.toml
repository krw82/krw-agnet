[project]
name = "krw-ontology-runtime"
version = "0.1.0"
description = "Canonical read-only KRW ontology and Guru capability runtime"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.27,<2",
  "pydantic>=2.11,<3",
  "starlette>=0.47,<2",
  "uvicorn>=0.34,<1",
  "PyYAML>=6,<7",
  "yfinance>=1.2,<2",
]

[project.scripts]
krw-capabilityd = "krw_capability_runtime.__main__:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krw_capability_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
