schema_version: "0.1.0"

types:
  SourceDocument:
    id_pattern: "source:{ticker}:{period}:{doc_type_key}"
    fields:
      id: {type: string, required: true}
      type: {type: string, enum: ["SourceDocument"], required: true}
      ticker: {type: string, required: true}
      source_document_id: {type: string, required: false}
      document_type: {type: string, required: true}
      period: {type: string, required: true}
      metadata_ref: {type: string, description: "path to metadata.json", required: false}
      schema_version: {type: string, required: true}

  SourceSpan:
    id_pattern: "span:{ticker}:{period}:{doc_type_key}:{section}:{seq:04d}"
    fields:
      id: {type: string, required: true}
      type: {type: string, enum: ["SourceSpan"], required: true}
      ticker: {type: string, required: true}
      source_document_id: {type: string, required: true}
      document_type: {type: string, required: true}
      period: {type: string, required: true}
      section_name: {type: string, required: true}
      section_number: {type: string, required: true}
      span_index: {type: integer, required: true}
      start_char: {type: integer, required: true, description: "Absolute offset within clean.md"}
      end_char: {type: integer, required: true, description: "Absolute offset within clean.md"}
      text: {type: string, required: true}
      text_hash: {type: string, required: true, description: "sha256 hash of normalized span text"}
      char_count: {type: integer, required: true}
      section_detection_confidence: {type: string, enum: ["high", "medium", "low"], required: true}
      section_detection_method: {type: string, required: true}
      schema_version: {type: string, required: true}

  EvidenceQuote:
    id_pattern: "quote:{ticker}:{period}:{doc_type_key}:{section}:{seq:04d}:{quote_seq:03d}"
    fields:
      id: {type: string, required: true}
      type: {type: string, enum: ["EvidenceQuote"], required: true}
      ticker: {type: string, required: true}
      source_document_id: {type: string, required: true}
      document_type: {type: string, required: true}
      period: {type: string, required: true}
      source_span_id: {type: string, required: true}
      quote_text: {type: string, required: true}
      quote_type: {type: string, enum_ref: "quote_types.yaml", required: true}
      section_name: {type: string, required: true}
      start_char: {type: integer, required: false, description: "Optional offset within SourceSpan.text"}
      end_char: {type: integer, required: false, description: "Optional offset within SourceSpan.text"}
      absolute_start_char: {type: integer, required: false, description: "Optional derived offset within clean.md"}
      absolute_end_char: {type: integer, required: false, description: "Optional derived offset within clean.md"}
      confidence: {type: string, enum: ["high", "medium", "low"], required: true}
      review_status: {type: string, enum: ["accepted", "needs_review", "rejected"], default: "accepted"}
      language_signals: {type: array, items: LanguageSignal, required: false, description: "Optional. Embedded during quote extraction."}
      schema_version: {type: string, required: true}

  LanguageSignal:
    id_pattern: "signal:{ticker}:{period}:{doc_type_key}:{section}:{seq:04d}:{signal_seq:03d}"
    fields:
      id: {type: string, required: true}
      type: {type: string, enum: ["LanguageSignal"], required: true}
      ticker: {type: string, required: true}
      source_document_id: {type: string, required: true}
      document_type: {type: string, required: true}
      period: {type: string, required: true}
      source_quote_id: {type: string, required: true}
      signal_text: {type: string, required: true}
      signal_type: {type: string, enum_ref: "language_signals.yaml", required: true}
      strength: {type: string, enum: ["strong", "medium", "weak"], required: true}
      direction: {type: string, enum: ["positive", "negative", "neutral", "risk"], required: true}
      certainty: {type: string, enum: ["observed", "conditional", "expected", "uncertain", "structural"], required: true}
      temporal_scope: {type: string, enum: ["historical", "current", "future_or_potential", "ongoing"], required: true}
      exact_match_verified: {type: boolean, required: true}
      schema_version: {type: string, required: true}

  ResearchClaim:
    id_pattern: "claim:{ticker}:{period}:{doc_type_key}:{slug}"
    fields:
      id: {type: string, required: true}
      type: {type: string, enum: ["ResearchClaim"], required: true}
      ticker: {type: string, required: true}
      source_document_id: {type: string, required: true}
      document_type: {type: string, required: true}
      period: {type: string, required: true}
      claim_text: {type: string, required: true}
      claim_type: {type: string, enum_ref: "claim_types.yaml", required: true}
      supported_by_quotes: {type: array, items: string, required: true, min_items: 1}
      related_metrics: {type: array, items: string, required: false}
      object_type_hints: {type: array, items: string, required: false, description: "AI semantic hints. Allowed canonical values include RiskFactor, GrowthDriver, Headwind, BusinessActivity, ExternalFactorExposure, ChangeEvent."}
      theme_hint: {type: string, required: false, description: "Canonical-ish short theme label for grouping related claims."}
      factor_hint: {type: string, required: false, description: "Canonical external factor candidate, snake_case when possible."}
      activity_hint: {type: string, required: false, description: "Canonical business activity candidate, snake_case when possible."}
      benchmark_hint: {type: string, required: false, description: "Named benchmark/index/reference price if directly supported, e.g. Henry Hub."}
      impact_channels: {type: array, items: string, required: false, description: "Business/financial channels affected by the claim, e.g. revenue, cost_of_revenue, operating_margin."}
      effect_direction: {type: string, enum: ["positive", "negative", "mixed", "uncertain"], required: false}
      materiality_hint: {type: string, enum: ["high", "medium", "low", "unknown"], required: false}
      time_horizon: {type: string, enum: ["short", "medium", "long", "ongoing", "unknown"], required: false}
      sector_hint: {type: string, required: false}
      confidence: {type: string, enum: ["high", "medium", "low"], required: true}
      review_status: {type: string, enum: ["accepted", "needs_review", "rejected"], default: "accepted"}
      schema_version: {type: string, required: true}

  ResearchObject:
    description: "Shared schema for RiskFactor, GrowthDriver, Headwind. Type field discriminates."
    id_pattern: "{type_key}:{ticker}:{period}:{doc_type_key}:{slug}"
    type_key: "risk|growth_driver|headwind"
    fields:
      id: {type: string, required: true}
      type: {type: string, enum: ["RiskFactor", "GrowthDriver", "Headwind"], required: true}
      ticker: {type: string, required: true}
      source_document_id: {type: string, required: true}
      document_type: {type: string, required: true}
      period: {type: string, required: true}
      name: {type: string, required: true}
      category: {type: string, required: true}
      description: {type: string, required: true}
      supported_by_claims: {type: array, items: string, required: false}
      supported_by_quotes: {type: array, items: string, required: false}
      affects: {type: array, items: string, required: false}
      unmapped_impacts: {type: array, items: string, required: false}
      unmapped_metrics: {type: array, items: string, required: false}
      qualitative_impact: {type: string, required: true}
      confidence: {type: string, enum: ["high", "medium", "low"], required: true}
      review_status: {type: string, enum: ["accepted", "needs_review", "rejected"], default: "accepted"}
      schema_version: {type: string, required: true}

  BusinessActivity:
    id_pattern: "business_activity:{ticker}:{period}:{doc_type_key}:{slug}"
    description: "Evidence-backed business activity or operating activity extracted from company filings."
    fields:
      id: {type: string, required: true}
      type: {type: string, enum: ["BusinessActivity"], required: true}
      ticker: {type: string, required: true}
      source_document_id: {type: string, required: true}
      document_type: {type: string, required: true}
      period: {type: string, required: true}
      name: {type: string, required: true}
      activity_type: {type: string, required: true}
      description: {type: string, required: true}
      revenue_relevance: {type: string, enum: ["primary", "secondary", "none", "unknown"], default: "unknown"}
      cost_relevance: {type: string, enum: ["primary", "secondary", "none", "unknown"], default: "unknown"}
      related_metrics: {type: array, items: string, required: false}
      sector_tags: {type: array, items: string, required: false}
      supported_by_claims: {type: array, items: string, required: false}
      supported_by_quotes: {type: array, items: string, required: false}
      confidence: {type: string, enum: ["high", "medium", "low"], required: true}
      review_status: {type: string, enum: ["accepted", "needs_review", "rejected"], default: "accepted"}
      schema_version: {type: string, required: true}

  ExternalFactorExposure:
    id_pattern: "external_factor_exposure:{ticker}:{period}:{doc_type_key}:{slug}"
    description: "Evidence-backed exposure from external factors to operating, financial, or project channels."
    fields:
      id: {type: string, required: true}
      type: {type: string, enum: ["ExternalFactorExposure"], required: true}
      ticker: {type: string, required: true}
      source_document_id: {type: string, required: true}
      document_type: {type: string, required: true}
      period: {type: string, required: true}
      factor: {type: string, required: true}
      factor_category: {type: string, required: true}
      benchmark: {type: string, required: false}
      direction: {type: string, enum: ["up", "down", "volatile", "mixed", "unknown"], default: "unknown"}
      impact_channel: {type: string, required: true}
      effect_direction: {type: string, enum: ["positive", "negative", "mixed", "uncertain"], default: "uncertain"}
      mechanism: {type: string, required: true}
      evidence_grade: {type: string, enum: ["direct", "indirect", "derived", "unsupported", "conflicting", "unknown"], default: "unknown"}
      materiality: {type: string, enum: ["high", "medium", "low", "unknown"], default: "unknown"}
      time_horizon: {type: string, enum: ["short", "medium", "long", "unknown"], default: "unknown"}
      related_business_activities: {type: array, items: string, required: false}
      related_metrics: {type: array, items: string, required: false}
      sector_tags: {type: array, items: string, required: false}
      supported_by_claims: {type: array, items: string, required: false}
      supported_by_quotes: {type: array, items: string, required: false}
      confidence: {type: string, enum: ["high", "medium", "low"], required: true}
      review_status: {type: string, enum: ["accepted", "needs_review", "rejected"], default: "accepted"}
      schema_version: {type: string, required: true}

  AssumptionCandidate:
    id_pattern: "assumption:{ticker}:{period}:{doc_type_key}:{slug}"
    fields:
      id: {type: string, required: true}
      type: {type: string, enum: ["AssumptionCandidate"], required: true}
      ticker: {type: string, required: true}
      source_document_id: {type: string, required: true}
      document_type: {type: string, required: true}
      period: {type: string, required: true}
      name: {type: string, required: true}
      assumption_text: {type: string, required: true}
      assumption_type: {type: string, enum: ["growth_rate", "margin", "capex", "tax_rate", "wacc", "other"], required: true}
      value_hint: {type: string, required: false}
      supported_by_claims: {type: array, items: string, required: false}
      supported_by_quotes: {type: array, items: string, required: false}
      related_metrics: {type: array, items: string, required: false}
      unmapped_metrics: {type: array, items: string, required: false}
      confidence: {type: string, enum: ["high", "medium", "low"], required: true}
      review_status: {type: string, enum: ["accepted", "needs_review", "rejected"], default: "needs_review"}
      schema_version: {type: string, required: true}

  CompanyBusinessProfile:
    id_pattern: "company_business_profile:{ticker}:ALL"
    description: "Company-level profile summarizing business activities, revenue/cost sources, external factors, and uncertainties."
    fields:
      id: {type: string, required: true}
      type: {type: string, enum: ["CompanyBusinessProfile"], required: true}
      ticker: {type: string, required: true}
      source_document_id: {type: string, required: true}
      document_type: {type: string, required: true}
      period: {type: string, required: true}
      sector: {type: string, required: true}
      business_model_summary: {type: string, required: true}
      primary_business_activities: {type: array, items: string, required: false}
      primary_revenue_sources: {type: array, items: string, required: false}
      primary_cost_sources: {type: array, items: string, required: false}
      key_external_factors: {type: array, items: string, required: false}
      key_exposures: {type: array, items: string, required: false}
      key_metrics: {type: array, items: string, required: false}
      key_uncertainties: {type: array, items: string, required: false}
      source_object_ids: {type: array, items: string, required: false}
      confidence: {type: string, enum: ["high", "medium", "low"], required: true}
      review_status: {type: string, enum: ["accepted", "needs_review", "rejected"], default: "accepted"}
      schema_version: {type: string, required: true}

  TemporalLink:
    id_pattern: "temporal_link:{ticker}:ALL:{hash12}"
    description: "Company-level link between comparable objects across periods."
    fields:
      id: {type: string, required: true}
      type: {type: string, enum: ["TemporalLink"], required: true}
      ticker: {type: string, required: true}
      source_document_id: {type: string, required: true}
      document_type: {type: string, required: true}
      period: {type: string, required: true}
      from_object_id: {type: string, required: true}
      to_object_id: {type: string, required: true}
      from_period: {type: string, required: true}
      to_period: {type: string, required: true}
      relation: {type: string, required: true}
      rationale: {type: string, required: true}
      confidence: {type: string, enum: ["high", "medium", "low"], required: true}
      review_status: {type: string, enum: ["accepted", "needs_review", "rejected"], default: "accepted"}
      schema_version: {type: string, required: true}

  TrendObservation:
    id_pattern: "trend_observation:{ticker}:ALL:{hash12}"
    description: "Company-level metric or factor trend observed across periods."
    fields:
      id: {type: string, required: true}
      type: {type: string, enum: ["TrendObservation"], required: true}
      ticker: {type: string, required: true}
      source_document_id: {type: string, required: true}
      document_type: {type: string, required: true}
      period: {type: string, required: true}
      subject: {type: string, required: true}
      metric_or_factor: {type: string, required: true}
      from_period: {type: string, required: true}
      to_period: {type: string, required: true}
      direction: {type: string, enum: ["up", "down", "flat", "mixed", "unknown"], required: true}
      magnitude_text: {type: string, required: false}
      interpretation: {type: string, required: true}
      supported_by_objects: {type: array, items: string, required: true}
      confidence: {type: string, enum: ["high", "medium", "low"], required: true}
      review_status: {type: string, enum: ["accepted", "needs_review", "rejected"], default: "accepted"}
      schema_version: {type: string, required: true}

  ChangeEvent:
    id_pattern: "change_event:{ticker}:{period}:{hash12}"
    description: "Company-level event extracted from evidence-backed claims across filings."
    fields:
      id: {type: string, required: true}
      type: {type: string, enum: ["ChangeEvent"], required: true}
      ticker: {type: string, required: true}
      source_document_id: {type: string, required: true}
      document_type: {type: string, required: true}
      period: {type: string, required: true}
      event_type: {type: string, required: true}
      event_date: {type: string, required: false}
      description: {type: string, required: true}
      affected_objects: {type: array, items: string, required: false}
      supported_by_claims: {type: array, items: string, required: false}
      supported_by_quotes: {type: array, items: string, required: false}
      confidence: {type: string, enum: ["high", "medium", "low"], required: true}
      review_status: {type: string, enum: ["accepted", "needs_review", "rejected"], default: "accepted"}
      schema_version: {type: string, required: true}

  Metric:
    id_pattern: "metric:{canonical_name}"
    fields:
      id: {type: string, required: true}
      type: {type: string, enum: ["Metric"], required: true}
      name: {type: string, required: true}
      category: {type: string, required: true}
      unit: {type: string, required: true}
      description: {type: string, required: true}
      schema_version: {type: string, required: true}

  XBRLFact:
    id_pattern: "xbrl:{ticker}:{period}:{doc_type_key}:{safe_taxonomy_tag}:{hash8}"
    fields:
      id: {type: string, required: true}
      type: {type: string, enum: ["XBRLFact"], required: true}
      ticker: {type: string, required: true}
      source_document_id: {type: string, required: true}
      document_type: {type: string, required: true}
      period: {type: string, required: true}
      taxonomy_tag: {type: string, required: true}
      safe_taxonomy_tag: {type: string, required: true}
      value: {type: number, required: true}
      unit: {type: string, required: true}
      context_ref: {type: string, required: true}
      source_filing_detail: {type: string, required: true}
      decimals: {type: integer, required: false}
      schema_version: {type: string, required: true}

  FinancialMetricValue:
    id_pattern: "financial_metric:{ticker}:{period}:{doc_type_key}:{hash12}"
    fields:
      id: {type: string, required: true}
      type: {type: string, enum: ["FinancialMetricValue"], required: true}
      ticker: {type: string, required: true}
      source_document_id: {type: string, required: true}
      document_type: {type: string, required: true}
      period: {type: string, required: true}
      metric_name: {type: string, required: true}
      value: {type: number, required: true}
      unit: {type: string, required: true}
      fiscal_year: {type: integer, required: false}
      fiscal_period: {type: string, required: false}
      period_type: {type: string, required: false, description: "instant, quarter, year_to_date, annual, duration, or derived"}
      start_date: {type: string, required: false}
      end_date: {type: string, required: false}
      source_xbrl_fact_id: {type: string, required: true}
      source: {type: string, required: true}
      schema_version: {type: string, required: true}

  DerivedMetricValue:
    id_pattern: "derived_metric:{ticker}:{period}:{doc_type_key}:{hash12}"
    fields:
      id: {type: string, required: true}
      type: {type: string, enum: ["DerivedMetricValue"], required: true}
      ticker: {type: string, required: true}
      source_document_id: {type: string, required: true}
      document_type: {type: string, required: true}
      period: {type: string, required: true}
      metric_name: {type: string, required: true}
      value: {type: number, required: true}
      unit: {type: string, required: true}
      fiscal_year: {type: integer, required: false}
      fiscal_period: {type: string, required: false}
      period_type: {type: string, required: false}
      formula: {type: string, required: true}
      input_metric_ids: {type: array, items: string, required: true}
      source: {type: string, required: true}
      schema_version: {type: string, required: true}

  NumericEvidence:
    id_pattern: "numeric_evidence:{ticker}:{period}:{doc_type_key}:{hash12}"
    description: "Structured numeric evidence ledger row derived from accepted quote text, XBRL facts, metric values, or code-calculated support."
    fields:
      id: {type: string, required: true}
      type: {type: string, enum: ["NumericEvidence"], required: true}
      ticker: {type: string, required: true}
      source_document_id: {type: string, required: true}
      document_type: {type: string, required: true}
      period: {type: string, required: true}
      numeric_kind: {type: string, enum: ["amount", "percent", "number"], required: true}
      evidence_role: {type: string, enum: ["financial_amount", "percentage", "share_count", "employee_count", "operational_count", "duration", "date", "fiscal_year", "document_section", "regulatory_code", "product_model", "unknown"], required: true}
      value: {type: number, required: true}
      raw_text: {type: string, required: true}
      unit: {type: string, required: true}
      source_object_id: {type: string, required: true}
      source_field: {type: string, required: true}
      source_method: {type: string, enum: ["quote_text", "xbrl_fact", "financial_metric_value", "derived_metric_value", "calculated_numeric_support", "code_calculated"], required: true}
      source_quote_id: {type: string, required: false}
      formula: {type: string, required: false}
      input_object_ids: {type: array, items: string, required: false}
      schema_version: {type: string, required: true}

  CalculatedNumericSupport:
    id_pattern: "calculated_numeric:{ticker}:{period}:{doc_type_key}:{hash12}"
    description: "Code-calculated numeric support derived only from accepted quote/XBRL/metric inputs."
    fields:
      id: {type: string, required: true}
      type: {type: string, enum: ["CalculatedNumericSupport"], required: true}
      ticker: {type: string, required: true}
      source_document_id: {type: string, required: true}
      document_type: {type: string, required: true}
      period: {type: string, required: true}
      calculation_type: {type: string, enum: ["difference", "sum", "ratio", "growth", "margin", "other"], required: true}
      value: {type: number, required: true}
      unit: {type: string, required: true}
      formula: {type: string, required: true}
      input_object_ids: {type: array, items: string, required: true}
      display_value: {type: string, required: false}
      source: {type: string, required: true}
      schema_version: {type: string, required: true}

  Edge:
    id_pattern: "edge:{ticker}:{period}:{doc_type_key}:{relation_id}:{hash10}"
    fields:
      id: {type: string, required: true}
      type: {type: string, enum: ["Edge"], required: true}
      ticker: {type: string, required: true}
      source_document_id: {type: string, required: true}
      document_type: {type: string, required: true}
      period: {type: string, required: true}
      from_id: {type: string, required: true}
      to_id: {type: string, required: true}
      relation_name: {type: string, required: true}
      relation_id: {type: string, required: true}
      edge_class: {type: string, required: true, description: "Semantic class of the edge, e.g. evidence, interpretation, metric_impact, business_model, exposure_link, temporal, event, summary."}
      evidence_level: {type: string, required: true, description: "Support strength for the edge, e.g. direct, derived, inferred, summary."}
      generation_method: {type: string, required: true, description: "Deterministic or AI-assisted method that produced this edge."}
      rationale: {type: string, required: true, description: "Short reason explaining why this edge exists."}
      confidence: {type: string, enum: ["high", "medium", "low"], required: true}
      review_status: {type: string, enum: ["accepted", "needs_review", "rejected"], default: "accepted"}
      schema_version: {type: string, required: true}
